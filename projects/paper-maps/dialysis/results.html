re and follow-up windows differ. This is not a test of a difference between effects.","basis":"paper_explicit","page":13,"quote":"Positive average supply responses are therefore\nconcentrated among the first two payment-period cohorts"},{"id":"cohort_q","from":"q2021","to":"q2023","type":"timing","label":"Early increase and later decline","explanation":"The 2021 treatment average is positive and the 2023 average negative. Cohort age, entry-year conditions and exposure differ; the pattern does not isolate the temporary bonus.","basis":"paper_explicit","page":13,"quote":"Cohortageandcalendar-year\nconditions also vary across these paths"},{"id":"entrant_incumbent","from":"q2021","to":"q_incumbents","type":"subgroup","label":"Entrants alongside incumbents","explanation":"The positive entrant contribution coexists with an imprecise incumbent contrast. Distinct significance levels do not establish significant heterogeneity.","basis":"paper_explicit","page":20,"quote":"thenetresponseacross\nestablished facilities and the covered market remains unresolved"},{"id":"entrant_market","from":"q2021","to":"q_market","type":"subgroup","label":"Cohort expansion and net market uncertainty","explanation":"Early entrants are a small share of total care. Their positive contribution leaves the net market response and patient reallocation unresolved.","basis":"paper_explicit","page":20,"quote":"Substantial changes within these small cohorts can therefore make\na modest contribution to total regional supply"},{"id":"provider_market","from":"p2021","to":"p_market","type":"subgroup","label":"Provider counts at different scales","explanation":"The 2021 cohort count and covered-market count cover different populations and use different baseline adjustments. Neither establishes a displacement mechanism.","basis":"paper_explicit","page":19,"quote":"Allfouraveragesarestatisticallyinsignificant"},{"id":"sustained","from":"p2021","to":"continued_counts","type":"measure_check","label":"Common-window continuing provision","explanation":"Counts of facilities active in both 2023 and 2024 support a continuing contribution by early cohorts.","basis":"paper_explicit","page":49,"quote":"both increases are statistically significant"},{"id":"per_facility","from":"continued_counts","to":"continuity_facility","type":"measure_check","label":"Counts differ from conditional persistence","explanation":"More continuing locations does not isolate a change in individual facilities’ persistence when entry responds to assignment.","basis":"paper_explicit","page":49,"quote":"leaving individual facilities’ persistence and selection into entry\ndifficult to separate"},{"id":"later_persistence","from":"p2023","to":"continuity2023","type":"measure_check","label":"Later-cohort counts and conditional histories differ","explanation":"The average provider-count response is imprecise, while conditional provision in both 2023 and 2024 declines. Populations, denominators and windows differ.","basis":"map_comparison","page":49,"quote":"whiletheconditionalfacilitydeclineisstatistically\nsignificant"},{"id":"counts_allocation","from":"count_levels","to":"decomp_p","type":"related_outcome","label":"Entrant counts enter the accounting identity","explanation":"The original entrant-count difference is valued at the average provision rate in the provider allocation.","basis":"paper_explicit","page":16,"quote":"values\nthe difference in original entrant counts at the average provision proportion"},{"id":"provider_allocation","from":"p2021","to":"decomp_p","type":"measure_check","label":"Accounting for the provider contrast","explanation":"The count and provision-rate components sum to the provider contrast; they are not separate identified causal channels.","basis":"paper_explicit","page":17,"quote":"Theseareaccountingallocations"},{"id":"treatment_allocation","from":"q2021","to":"decomp_q","type":"measure_check","label":"Accounting for the treatment contrast","explanation":"The treatment contrast separates arithmetically into counts and mean service per original entrant, retaining nonproviders and exits.","basis":"paper_explicit","page":17,"quote":"The results therefore leave causal mediation through entry and operating\ndecisions unresolved"},{"id":"count_share","from":"independent_counts","to":"independent_share","type":"measure_check","label":"Ownership share differs from entrant count","explanation":"The 2023 independent share rises at 10%, but the independent count contrast is not statistically significant. The denominator and estimand differ.","basis":"map_comparison","page":55,"quote":"Independent facilities\nETC effect−9.295−1.142 25.105 ∗ −17.185"},{"id":"composition","from":"independent_share","to":"big_two_share","type":"related_outcome","label":"Different parts of entrant ownership composition","explanation":"The 2023 independent and Big Two shares move in opposite directions. These observed shares do not identify a treatment effect within fixed ownership types.","basis":"map_comparison","page":52,"quote":"These comparisons describe\nwho enters and the resources recorded near entry"},{"id":"train_supply21","from":"q2021","to":"train2021","type":"related_outcome","label":"Training accompanies early-cohort service","explanation":"Regional training and home treatments rise together; unique trainees and completed courses are unavailable, so mediation is unresolved.","basis":"paper_explicit","page":23,"quote":"Reported training rises for the 2021 cohort and falls for the 2023 cohort"},{"id":"train_supply23","from":"q2023","to":"train2023","type":"related_outcome","label":"Lower training accompanies later treatment decline","explanation":"The 2023 regional training decline accompanies lower home-treatment volume; the reporting window starts after entry.","basis":"paper_explicit","page":23,"quote":"the\n2023 decline accompanies lower recorded home-treatment volume"},{"id":"training_units","from":"train2021","to":"training_facility","type":"measure_check","label":"Regional training versus training per entrant","explanation":"The regional total is significant at 10%; the per-facility average is not statistically significant. Entry and reporting selection limit interpretation.","basis":"paper_explicit","page":60,"quote":"weaker evidence of more training per early entrant than of a\nlarger regional training contribution"},{"id":"admin_support","from":"q2021","to":"admin2021","type":"related_outcome","label":"Administrative resources accompany supply","explanation":"The staffing increase accompanies service expansion but does not establish that administrative labor caused it.","basis":"paper_explicit","page":27,"quote":"Higher reported training and\nadministrative staffing accompany the cohort’s larger service contribution"},{"id":"resource_compare","from":"admin2021","to":"other_inputs","type":"related_outcome","label":"Broader input responses remain imprecise","explanation":"Administrative staffing is the significant 2021 input total at the paper’s 10% threshold; the other positive totals remain uncertain.","basis":"paper_explicit","page":24,"quote":"Theadministrativeandmanagementresponseisstatisticallysignificant;theotherfouraverages\nremain imprecisely estimated"},{"id":"resource_cohorts","from":"admin2021","to":"admin2024","type":"timing","label":"Administrative response differs in sign by cohort","explanation":"Opposite signs across cohorts do not by themselves establish a formal between-cohort difference.","basis":"paper_explicit","page":24,"quote":"The administrative estimates thus\nhave opposite signs for the earliest and latest cohorts"},{"id":"cost_output","from":"q2022","to":"cost2022","type":"related_outcome","label":"Conditional cost ratio and total care differ","explanation":"The cost ratio uses a narrower, positive-denominator sample and all-payer services; it cannot be interpreted as a direct decomposition of Medicare treatment volume.","basis":"paper_explicit","page":25,"quote":"Differences in samples and reporting\nwindows limit cross-outcome comparisons"},{"id":"labor_volume","from":"q2023","to":"treat_per_fte","type":"related_outcome","label":"Treatment volume and a conditional labor ratio","explanation":"The later cohort has lower Medicare home volume and fewer all-payer treatments per FTE in a narrower sample. The map does not infer productivity loss.","basis":"paper_explicit","page":25,"quote":"can\nreflect changes in service volume, care requirements, or entrant composition"},{"id":"vascular","from":"catheter","to":"fistula","type":"related_outcome","label":"Related vascular-access indicators","explanation":"Lower catheter use and higher fistula use are related indicators summarized by the vascular-access index, not independent confirmation of an entrant mechanism.","basis":"paper_explicit","page":74,"quote":"thevascular-accessindexsummarizestheserelated\nimprovements"},{"id":"welfare","from":"q2021","to":"clinical_other","type":"uncertain","label":"Patient welfare link remains unresolved","explanation":"An entrant supply increase does not establish broad health benefits; mortality and other clinical outcomes are imprecise and patient histories are unlinked.","basis":"paper_explicit","page":74,"quote":"leave the link between entrant supply, regional access, and patient welfare uncertain"},{"id":"access_supply","from":"p2021","to":"geography","type":"related_outcome","label":"Active provision differs from geographic capability","explanation":"The entrant provider count and documented geographic availability measure different concepts and populations; access averages are not statistically significant.","basis":"map_comparison","page":74,"quote":"actual travel, waiting times, and patient choices are unobserved"},{"id":"market_share","from":"q_market","to":"home_share","type":"measure_check","label":"Medicare volume and all-payer share differ","explanation":"Both market averages are imprecise, but their payer scope, denominator and reporting samples differ.","basis":"map_comparison","page":75,"quote":"All-payer home treatments as a share of all\ntreatments"},{"id":"finance_cost","from":"cost2022","to":"net_income","type":"uncertain","label":"Cost ratios do not establish profitability","explanation":"Cohort expenses per treatment and market accounting net income use different populations; the latter already differs in the transition year.","basis":"map_comparison","page":25,"quote":"Assessing profitability or patient financial gains also requires facility revenues and patient payments"},{"id":"check_ppml","from":"q2021","to":"ppml","type":"measure_check","label":"Alternative functional form","explanation":"Compare additive and multiplicative estimates; fitted support can change.","basis":"paper_explicit","page":26,"quote":"This agreement supports the direction of the early-cohort response under a multiplicative mean"},{"id":"check_large","from":"q2021","to":"drop_three","type":"measure_check","label":"Sensitivity to influential markets","explanation":"The positive 2021 point estimate persists but loses statistical significance when three large markets are excluded.","basis":"paper_explicit","page":26,"quote":"their statistical precision is\nsensitive to those observations"},{"id":"check_reporting","from":"q2021","to":"complete_roster","type":"measure_check","label":"Sensitivity to complete histories","explanation":"Complete reporting narrows the sample; it probes sensitivity rather than identifying the unobserved supply.","basis":"paper_explicit","page":26,"quote":"They cannot establish that missingness is\nrandom"},{"id":"check_extension","from":"q2021","to":"extension","type":"timing","label":"Follow-up through 2025","explanation":"The extended average remains significant at 10%; significance is not claimed for every year.","basis":"paper_explicit","page":27,"quote":"Several annual estimates remain imprecise, leaving a distinct effect in every year\nunresolved"},{"id":"lit_entry","from":"prior_huckfeldt","to":"decomp_q","type":"related_outcome","label":"From entry and exit to later cohort service","explanation":"The focal paper positions its fixed-roster service analysis as building on prior entry/exit evidence. No exact earlier coefficient or contradiction is asserted.","basis":"paper_explicit","page":2,"quote":"I follow fixed entrant rosters to measure how their service\ncontributions develop after opening"},{"id":"lit_cohorts","from":"prior_sedlacek","to":"count_levels","type":"related_outcome","label":"Formation conditions motivate a cohort perspective","explanation":"Cohort formation motivates following the fixed original roster. The cited structural model of latent growth potential is not reproduced here.","basis":"paper_explicit","page":2,"quote":"This\ncohort perspective is motivated by evidence that conditions at firm formation can shape later cohort\noutcomes"},{"id":"lit_decomp","from":"prior_sedlacek","to":"decomp_q","type":"related_outcome","label":"Firm numbers and average size have an accounting parallel","explanation":"The manuscript explicitly compares its count/service distinction with this cited study, while distinguishing their structural analysis.","basis":"paper_explicit","page":17,"quote":"This distinction parallels the separation of firm numbers and average firm size\nin Sedláček and Sterk (2017"},{"id":"lit_choice","from":"prior_dai","to":"p2021","type":"related_outcome","label":"Regulated prices and dialysis service supply","explanation":"This is a thematic connection. The focal discussion does not give Dai’s specific finding, so empirical agreement is unresolved.","basis":"map_comparison","page":3,"quote":"Dai (2014) examines service choice under regulated prices"},{"id":"lit_ji","from":"prior_ji","to":"q2021","type":"uncertain","label":"Patient use versus entrant supply","explanation":"The cited evaluation concerns patient use or transplantation; this study measures recorded service from fixed entry cohorts. The manuscript does not supply a source-specific result for a signed comparison.","basis":"map_comparison","page":3,"quote":"withfindingsthatvaryacrosspopulations\nand follow-up periods"},{"id":"lit_koukounas","from":"prior_koukounas","to":"q2021","type":"uncertain","label":"Patient use versus entrant supply","explanation":"The cited evaluation concerns patient use or transplantation; this study measures recorded service from fixed entry cohorts. The manuscript does not supply a source-specific result for a signed comparison.","basis":"map_comparison","page":3,"quote":"withfindingsthatvaryacrosspopulations\nand follow-up periods"}],"caveats":["The source is ETC4 (5).pdf, a 90-page October 2026 manuscript. Numbers and classifications reflect this version; the analysis code and underlying data have not been rerun.","The 2021 headline provider and treatment averages have one star: significance at 10%, not 5%. Stars come from individual sharp-no-effect randomization tests; they need not agree with 95% HC2 intervals.","Tests are not simultaneously adjusted across outcomes. A significant estimate and a non-significant estimate do not by themselves establish different effects.","Original entrant rosters are fixed, but who enters can respond to assignment. Cohort totals include entry, composition and later activity; conditional facility or ratio comparisons do not hold the entrant population fixed across assignment.","The reporting population includes independently owned and chain-owned freestanding facilities. It excludes hospital-based units outside Form 265 scope.","Selected HRRs and partially observed facility totals identify recorded supply only under additional observation assumptions. Randomization does not remove reporting selection or cross-HRR spillover concerns.","The count/service decomposition is an accounting identity with uncertainty, not causal mediation. Cohort age and payment-phase exposure cannot be separately identified here.","Cited papers were not independently read. The manuscript gives some only grouped or thematic descriptions; their individual signs, estimates and significance are deliberately left unspecified.","Not statistically significant does not mean zero. Unavailable outcomes, such as full-report training for 2024 entrants, are not non-significant estimates.","This overview covers the main result families and key appendix contrasts rather than every annual coefficient. Click a node for its scope, table reference and source excerpt."],"methods":{"summary":"The identification map separates randomized HRR assignment and the recorded-supply ITT from data construction, estimators, inference, maintained assumptions and sensitivity checks. Fixed cohorts retain nonproviders and exits; sample membership and reporting may nevertheless respond to assignment. Randomization supplies the design, while the map keeps selection, interference, physical-entry classification, conditional ratios and accounting-versus-mediation limits visible. It describes the manuscript’s methods and does not independently validate the analysis code.","classification":{"designs":[{"family":"randomized_experiment","role":"primary","label":"Stratified geographic randomized assignment of ETC","scope":"Assignment of 302 HRRs; primary ITT contrasts for fixed entry-cohort recorded supply and incumbent or covered-market outcomes, conditional on the stated observation and sample-membership requirements.","nodeIds":["assignment","exposure","target"]}],"estimators":[{"family":"ols_ancova","role":"primary","label":"Additive cohort-year OLS with baseline outcome and controls","scope":"Fixed entry-cohort HRR totals for facilities and Medicare home-treatment equivalents, with region-by-cohort-year intercepts; also the common additive framework for cohort outcomes.","nodeIds":["cohort_ols","covariates","target"]},{"family":"panel_fixed_effects","role":"primary","label":"HRR and region-year fixed-effects panel OLS","scope":"Incumbent and covered-market annual outcomes relative to 2019; the manuscript also applies this panel specification to supplementary market outcomes.","nodeIds":["panel","covariates","target"]},{"family":"ols_ancova","role":"secondary","label":"OLS comparisons conditional on observed entrants","scope":"Facility-level outcomes and per-facility averages for realized entrants; estimates condition on assignment-specific observed facility composition.","nodeIds":["conditional","hc2"]},{"family":"other","role":"secondary","label":"Standardized predictions and Shapley accounting decomposition","scope":"Descriptive allocation of adjusted provider and treatment contrasts to original entrant counts and service per entrant; components are not causal mediation effects.","nodeIds":["standardize","shapley"]},{"family":"ppml","role":"robustness","label":"PPML multiplicative conditional-mean sensitivity estimates","scope":"Functional-form checks for main supply outcomes; separation may alter fitted support, including the 2023 cohort sample.","nodeIds":["ppml_check","cohort_ols","panel"]}],"explanation":"ETC assignment of HRRs supplies randomized identification. Cohort contrasts use baseline-adjusted additive OLS; incumbent and market paths use panel fixed effects, not a stated DiD design. RI and HC2 errors are inference procedures. Conditional entrant estimates reflect realized composition; Shapley accounting does not identify causal channels. PPML is a robustness estimator."},"nodes":[{"id":"target","kind":"estimand","label":"ITT on recorded supply from fixed entry cohorts","summary":"The geographic assignment contrast includes changes in entry, entrant composition and subsequent service. It targets recorded cohort supply in the stated HRRs, under assignment-invariant observation and sample membership.","detail":"A fixed realized entry roster is followed through time, but the counterfactual set of facilities that would enter can differ under assignment. The manuscript does not randomize individual entrants.","scope":"Main cohort totals; distinct from conditional per-facility effects","status":"described","basis":"paper_explicit","page":11,"quote":"identifies an intention-to-treat response that\nincludes changes in entry, entrant composition, and subsequent activity"},{"id":"assignment","kind":"comparison","label":"91 treated and 211 control HRRs, stratified by region","summary":"CMS randomized 302 hospital referral regions across four Census regions, with 91 assigned to ETC and 211 to control.","detail":"Mandatory Maryland assignments under a separate rule are excluded. The four regional treatment totals are preserved in randomization inference. The design is geographic random assignment, not an observational adoption design.","scope":"Original assignment frame","status":"described","basis":"paper_explicit","page":4,"quote":"91 of 302 HRRs were assigned to ETC and 211 to control"},{"id":"exposure","kind":"treatment","label":"Mandatory ETC assignment covers facilities and clinicians","summary":"Eligible providers in selected HRRs participate in ETC. Both incumbents and eligible new sites, including new chain locations, are exposed.","detail":"Measured facility responses reflect facility and clinician incentives together. Entry means a physical site opening, not creation of a new independent firm.","scope":"Assignment to the combined ETC payment environment","status":"described","basis":"paper_explicit","page":4,"quote":"Participation was mandatory for eligible providers in selected HRRs"},{"id":"phases","kind":"treatment","label":"Temporary home bonus plus continuing performance incentives","summary":"HDPA adds 3%, 2% and 1% to eligible home payments in 2021–2023. PPA payments begin in July 2022 using earlier performance windows and continue after HDPA ends.","detail":"Different entry cohorts differ in initial incentives, later exposure, age and calendar conditions. The paper does not separately identify the effect of each policy component.","scope":"Policy timing and interpretation of entry cohorts","status":"described","basis":"paper_explicit","page":5,"quote":"The PPA continued during 2024–2025 after the\nHDPA ended"},{"id":"scope","kind":"data","label":"Freestanding reporting scope includes chain-owned sites","summary":"Form 265 eligibility defines the common population for entrants, incumbents and market outcomes. It includes independently owned and chain-owned sites and excludes hospital-based units outside the reporting category.","detail":"The full incumbent roster contains 6,971 facilities. The 400 classified 2021–2024 entrants include 362 represented in cohort-specific main samples. Freestanding is a reporting category, not an ownership restriction.","scope":"Approximately 95% of registry-active facilities in randomized markets","status":"described","basis":"paper_explicit","page":6,"quote":"This population includes both independently owned and chain-owned"},{"id":"sources","kind":"data","label":"Link service reports to facility and physical-site histories","summary":"HCRIS cost reports measure service and inputs; POS certification and operating histories, DFC, historical addresses and dated external records support facility identity and physical entry.","detail":"The manuscript retains report identifiers, dates, worksheet evidence and acceptance decisions. This map describes that construction without inspecting the underlying archive or rerunning it.","scope":"Public administrative source construction","status":"described","basis":"paper_explicit","page":7,"quote":"reconciling CMS certification and POS histories with Dialysis\nFacility Compare (DFC), historical addresses"},{"id":"fixed_rosters","kind":"data","label":"Freeze original cohorts; keep known nonproviders and exits","summary":"Original entry-year membership is held fixed. Known nonproviders and documented exits stay in the denominator and contribute known zeros; unresolved activity remains unknown.","detail":"Retaining zero-activity members avoids redefining cohorts as current providers. It does not remove the treatment-induced selection of who originally enters.","scope":"Entry cohorts and predetermined 2019 incumbent roster","status":"described","basis":"paper_explicit","page":7,"quote":"Known nonproviders and documented\nexits remain in this roster with zero activity"},{"id":"measurement","kind":"data","label":"Provider counts and Medicare treatment equivalents differ","summary":"Positive recorded Medicare home activity establishes provision. Volume sums home-treatment equivalents, including a conversion of weekly peritoneal counts; multiple equivalents can belong to one patient.","detail":"Authorization establishes capability rather than realized provision. A known positive component can establish provision when annual quantity is incomplete. The two outcomes are not unique-patient counts.","scope":"Main service outcomes P and Q","status":"described","basis":"paper_explicit","page":7,"quote":"Patients can contribute multiple equivalents"},{"id":"zero_missing","kind":"data","label":"Distinguish empty cohorts, partial reports and missing activity","summary":"Empty local cohorts have known zero contribution. Partially observed populations contribute verified activity; nonempty populations with no known contribution are unavailable.","detail":"Statistical donor-based completions are excluded. A fixed geographic sample can still contain changing facility reporting within it.","scope":"HRR aggregation and report reconciliation","status":"described","basis":"paper_explicit","page":8,"quote":"An empty local entry cohort has a known zero\ncontribution"},{"id":"support","kind":"data","label":"Choose fixed HRR support using full-window availability","summary":"The main panels retain HRRs with jointly observed main outcomes in every required year. Geography is fixed within each population, but the represented markets can differ across cohorts.","detail":"This selection uses follow-up information. It does not require every facility in a retained HRR to have a complete report; the complete-history check applies that stricter requirement separately.","scope":"301 market/incumbent HRRs; 2021–2024 cohorts: 290, 296, 293, 295","status":"described","basis":"paper_explicit","page":8,"quote":"They were selected by joint availability of the two\nmain outcomes in every required year"},{"id":"windows","kind":"data","label":"Training, input and ratio windows are outcome-specific","summary":"Training begins after entry and requires full qualifying reports. Inputs include entry-year reports, which may be partial. Matched ratios require observed components and positive denominators.","detail":"Training reports last 330–400 days, cover at least 90% of the calendar year and begin no earlier than entry. Hence 2024 entrants have no main-window full-report training outcome. The 2021 input totals use 285 HRRs, versus 68 for several ratios.","scope":"Additional outcomes and comparability across nodes","status":"described","basis":"paper_explicit","page":8,"quote":"Training outcomes use\nqualifying reports from the year after entry through 2024"},{"id":"covariates","kind":"estimator","label":"Adjust for baseline supply and eight predetermined controls","summary":"Every regression includes market size, patient age and demographic shares, poverty, education and COVID-19 mortality around assignment disclosure. Cohort equations also adjust for the relevant 2019 market outcome.","detail":"Baseline and control slopes vary with observation year. The frozen 6,921-facility market-size covariate is distinct from the reconciled 6,971-facility incumbent roster.","scope":"Covariate-adjusted assignment comparisons","status":"described","basis":"paper_explicit","page":9,"quote":"Every regression includes the same eight predetermined market controls"},{"id":"cohort_ols","kind":"estimator","label":"Cohort-year OLS compares assigned HRRs within regions","summary":"Equation 2 estimates additive cohort supply contrasts, with region-by-cohort-year intercepts, a 2019 outcome baseline and predetermined controls. HRR fixed effects would absorb assignment within a cohort-year comparison.","detail":"Units are facilities or treatment equivalents per HRR. Original roster membership is fixed over follow-up, while the geographic assignment effect includes changes in who enters.","scope":"Each fixed entry cohort, entry through 2024","status":"described","basis":"paper_explicit","page":11,"quote":"comparestreatedandcontrolHRRswithintherandomized\nregions"},{"id":"panel","kind":"estimator","label":"Incumbent and market panels use 2019 as the reference","summary":"Equation 1 includes HRR fixed effects, region-by-year effects and year-specific treatment and control interactions. Treatment coefficients compare paths relative to 2019.","detail":"The reference predates assignment disclosure, but the proposal was public during 2019. The 2020 coefficient is a transition-year contrast, not a post-payment outcome.","scope":"Incumbent, market and supplementary market outcomes","status":"described","basis":"paper_explicit","page":11,"quote":"relative to the omitted reference year of\n2019"},{"id":"conditional","kind":"estimator","label":"Facility comparisons condition on realized entrants","summary":"Equations A1 and A2 compare observed facilities, with HRR assignment, baseline and controls. Initial configuration requires an accepted record within 180 days of entry.","detail":"Facilities receive equal weights; standard errors and reassignments remain at HRR level. These coefficients do not hold the potential entrant population fixed.","scope":"Training per facility, provision histories and initial configuration","status":"described","basis":"paper_explicit","page":43,"quote":"these coefficients describe the facilities observed under each assignment, including\ndifferences in entrant composition"},{"id":"averages","kind":"estimator","label":"Average annual coefficients equally and retain covariance","summary":"Main averages weight annual coefficients equally. Cohort windows start at entry; incumbent and market averages cover 2021–2024.","detail":"A significant average does not establish significance in every year. The observed control mean and regression-standardized counterfactual mean are different quantities.","scope":"Main reported averages and extension","status":"described","basis":"paper_explicit","page":12,"quote":"Main tables average annual coefficients equally and retain their covariance\nwithin HRRs"},{"id":"ri","kind":"inference","label":"10,000 region-stratified randomization reassignments","summary":"Stars use a studentized efficient-score statistic under the sharp hypothesis of no assignment effect. Reassignments preserve regional totals across all 302 HRRs, even for subset regressions.","detail":"The restricted nuisance model is fitted once. Ownership/composition comparisons use fully re-estimated studentized linear statistics. The selected observation mask stays fixed computationally; its invariance remains an identifying condition.","scope":"Reported individual tests; main OLS and PPML specifications","status":"described","basis":"paper_explicit","page":12,"quote":"10,000 assignments preserving treatment\ntotals within the four original regions"},{"id":"hc2","kind":"inference","label":"HRR-clustered HC2 standard errors and 95% intervals","summary":"Reported standard errors use HC2 and HRR clustering, including facility regressions. Plotted intervals summarize uncertainty in coefficient estimates and may disagree with RI significance.","detail":"One, two and three stars denote 10%, 5% and 1%. The 2021 main supply averages have one star; the map does not relabel them as 5% significant.","scope":"Coefficient uncertainty versus randomization test decisions","status":"described","basis":"paper_explicit","page":12,"quote":"Reported standard errors use the HC2\nadjustment and are clustered at the HRR level"},{"id":"multiple","kind":"inference","label":"Reported tests have no simultaneous outcome adjustment","summary":"Significance refers to individual comparisons, without a simultaneous adjustment across the reported outcomes.","detail":"The map preserves the manuscript’s thresholds and does not convert exploratory breadth into family-wise evidence.","scope":"Interpretation of the many result branches","status":"described","basis":"paper_explicit","page":44,"quote":"Significance refers to individual comparisons without a simultaneous adjustment\nacross the reported outcomes"},{"id":"standardize","kind":"estimator","label":"Standardize both assignments over the same HRRs","summary":"Predict entrant counts, provider counts and treatments under each assignment, retaining observed baseline values and averaging over the same cohort HRRs.","detail":"Service rates are ratios of adjusted totals to adjusted original entrant counts. Empty HRRs remain in standardized totals; local rates for empty cohorts are undefined.","scope":"Adjusted levels used in the accounting decomposition","status":"described","basis":"paper_explicit","page":16,"quote":"Averagingoverthesamemarketsplacesthetwoassignmentstatesonacommon\ndistribution of market characteristics"},{"id":"shapley","kind":"estimator","label":"Symmetric count-and-service accounting decomposition","summary":"Shapley allocations average the two possible replacement orders for counts and service rates. Components sum to the adjusted additive contrast and split the interaction equally.","detail":"For treatments the components use original entrant counts and mean treatments per original entrant. For providers they use counts and the provision proportion; both retain nonproviders and later exits.","scope":"Provider and treatment decompositions, Equations 3–5","status":"described","basis":"paper_explicit","page":16,"quote":"It averages the contribution of each factor over the two possible orders"},{"id":"observation_assumption","kind":"assumption","label":"Observation and sample membership must be assignment-invariant","summary":"Causal interpretation of selected-sample recorded supply requires the observation process and sample membership not to change under reassignment in the relevant comparison.","detail":"A fixed observed mask in the RI calculation is not evidence that this counterfactual requirement holds. Complete-market extrapolation requires assumptions about unreported contributions.","scope":"Main ITT interpretation and RI on retained HRRs","status":"assumed","basis":"paper_explicit","page":11,"quote":"With assignment-invariant observation\nand sample membership"},{"id":"interference_assumption","kind":"assumption","label":"Account for possible spillovers across HRRs","summary":"A clean own-HRR interpretation must address operators changing activity in both treated and control markets. Cross-region chains can connect otherwise separately assigned HRRs.","detail":"This is the map’s reconstruction of the spillover condition from the stated limitation; the paper does not present a test eliminating cross-HRR interference.","scope":"Interference and interpretation of the assignment contrast","status":"assumed","basis":"map_interpretation","page":12,"quote":"Chains spanning treated and control HRRs may\nchange service in both groups"},{"id":"identity_assumption","kind":"assumption","label":"Physical openings and recorded quantities must be correctly classified","summary":"Interpreting administrative records as physical entry and service supply requires reliable site identities, dates and report mappings.","detail":"The map states this measurement requirement from the manuscript’s audit limitations. A first certification date by itself is not sufficient evidence of a new physical location.","scope":"Physical entry, exits, cohort membership and service measurements","status":"assumed","basis":"map_interpretation","page":40,"quote":"Remaining alias and\nsame-site ambiguities limit interpretation of administrative facility counts as distinct physical\ncapacity"},{"id":"coverage","kind":"diagnostic","label":"Report facility coverage without treating it as random missingness","summary":"Table A5 reports known provision and quantity among required facility records, including partial HRR coverage. Table A13 separately reports training availability by assignment.","detail":"For the 2021 cohort, known treatment coverage runs from 94.8% to 99.3% over 2021–2024. High coverage describes the observed panel; it does not resolve assignment-related reporting.","scope":"Observation-process diagnostic","status":"mixed","basis":"paper_explicit","page":12,"quote":"high coverage and imprecise coverage differences\ncannot establish that missingness is ignorable"},{"id":"balance","kind":"diagnostic","label":"Baseline tables describe cross-market imbalance","summary":"Tables 1 and A2 report region-adjusted baseline differences. Several characteristics have reported significance; the paper uses predetermined covariate adjustment.","detail":"These descriptive tests do not prove or disprove the randomized assignment mechanism. The design derives from assignment, not from a requirement that every baseline comparison be non-significant.","scope":"2019 characteristics and disclosure-period controls","status":"mixed","basis":"map_interpretation","page":9,"quote":"The descriptive differences show the cross-market variation used for\nbaseline adjustment"},{"id":"ppml_check","kind":"robustness","label":"PPML probes functional form; support may change","summary":"Re-estimation with a multiplicative conditional mean retains positive early-cohort patterns. The 2021 comparison keeps 290 HRRs; the 2023 fitted sample falls from 293 to 211 because of separation.","detail":"Cohort baselines use log(1 + baseline). The comparison can change functional form, baseline transformation and sample composition together.","scope":"Main service outcomes, Table A18","status":"mixed","basis":"paper_explicit","page":26,"quote":"For 2023, separation reduces fitted support from 293 to 211 HRRs"},{"id":"large_check","kind":"robustness","label":"Exclude the largest one or three baseline markets","summary":"Table A19 removes markets ranked by pre-policy facility counts. The 2021 estimates remain positive, but neither remains statistically significant after removing three.","detail":"The 2022 provider increase and 2023 treatment decline remain significant under both exclusions. This is sensitivity to represented markets, not a correction for all possible leverage.","scope":"Sensitivity of main supply results to market leverage","status":"mixed","basis":"paper_explicit","page":26,"quote":"their statistical precision is\nsensitive to those observations"},{"id":"complete_check","kind":"robustness","label":"Require every original facility-year to be observed","summary":"Table A20 requires both main outcomes for every original facility-year. The 2021 treatment result remains significant at 10%; the provider result is not statistically significant.","detail":"The restriction retains 281 of 290 HRRs for 2021 entrants, but only 97 incumbent and 86 market HRRs. It changes the represented population.","scope":"Sensitivity to incomplete facility reporting","status":"mixed","basis":"paper_explicit","page":26,"quote":"They cannot establish that missingness is\nrandom or identify the unreported contribution in excluded markets"},{"id":"followup","kind":"robustness","label":"Append 2025 while retaining earlier observations","summary":"The extension retains original HRR lists and all pre-2025 observations, appending available data and refitting annual specifications. Several HRRs lack 2025 cohort outcomes.","detail":"The 2025 market follows the verified 2024 roster and excludes unobserved 2025 entrants. An announced termination changes the expected policy horizon, so this is not a clean estimate of withdrawal of incentives.","scope":"Supplementary follow-up, Tables A21–A22","status":"mixed","basis":"paper_explicit","page":27,"quote":"retaining all earlier observations, main HRR lists, and baseline adjustments"},{"id":"bounds","kind":"diagnostic","label":"Bootstrap components and check economic bounds","summary":"Use 2,000 shared HRR bootstrap draws stratified by region and assignment, preserving cross-equation and cross-year covariance. Compare bootstrap and Delta standard errors and inspect economic admissibility.","detail":"All 2,000 draws for 2021 treatments satisfy bounds. Only 1,219 do for 2023; all finite draws still enter uncertainty estimates. This limits literal service-rate interpretation of 2023 allocations.","scope":"Uncertainty in Shapley allocations, Table A23","status":"mixed","basis":"paper_explicit","page":89,"quote":"781 draws contain a negative fitted quantity in at least one year"},{"id":"selection_limit","kind":"limitation","label":"Follow-up selection can compromise the original comparison","summary":"The fixed HRR samples are selected using availability that may respond to ETC. Retaining a selected geographic sample does not recreate unconditional randomization.","detail":"The recorded-supply interpretation is explicitly qualified. Neither random assignment nor a computationally fixed sample mask removes this concern.","scope":"Generalization and causal interpretation of retained samples","status":"limitation","basis":"paper_explicit","page":12,"quote":"The fixed HRR samples are selected using follow-up availability,\nwhich can itself respond to ETC"},{"id":"reporting_limit","kind":"limitation","label":"Within-HRR reporting changes can move measured supply","summary":"Totals sum known contributions inside each retained HRR. A change in reporting can change observed activity even when the geography is fixed.","detail":"Source reconciliation improves documentation but does not establish assignment-invariant measurement. Report completeness and Form 265 population coverage use different denominators.","scope":"Measured totals and complete-market extrapolation","status":"limitation","basis":"paper_explicit","page":12,"quote":"changes in reporting can affect measured supply even when the geography is constant"},{"id":"conditional_limit","kind":"limitation","label":"Selected entrants and positive denominators change the estimand","summary":"Facility averages and ratios condition on realized entry, report availability and positive denominators. Their interpretation includes changing composition across assignment states.","detail":"These comparisons can be informative descriptions, but do not isolate within-facility behavioral responses for a common fixed set of potential entrants.","scope":"Facility persistence, training, costs, staffing and configuration","status":"limitation","basis":"paper_explicit","page":11,"quote":"Facility-average and\npositive-denominator ratio estimates additionally condition on the realized entrant population"},{"id":"phase_limit","kind":"limitation","label":"Payment phases, facility age and calendar conditions remain bundled","summary":"Successive entry cohorts differ in initial HDPA rates, later PPA exposure, facility age and calendar conditions. Differences cannot separately identify these channels.","detail":"Continued service after the temporary bonus ends is still observed under ongoing PPA incentives. Persistence alone does not identify an irreversible investment mechanism.","scope":"Cross-cohort and post-2023 interpretation","status":"limitation","basis":"paper_explicit","page":5,"quote":"Separating the effects of HDPA, PPA, and investment at entry requires independent variation in these channels"},{"id":"mediation_limit","kind":"limitation","label":"Accounting components are not causal mediation effects","summary":"Changes in provision rates and mean service can reflect composition, adoption, cessation, patient mix and intensity. The allocation leaves causal pathways unresolved.","detail":"Point shares of 94% or 66% should not be read as identified causal fractions. The structural model in the motivating business-cohort literature is not estimated here.","scope":"Interpretation of entry-count and service-rate components","status":"limitation","basis":"paper_explicit","page":17,"quote":"The results therefore leave causal mediation through entry and operating\ndecisions unresolved"},{"id":"patient_limit","kind":"limitation","label":"Patient transfers and welfare require linked histories","summary":"Recorded entrant treatments do not distinguish new home-dialysis patients from transfers across providers. Market averages, costs and patient indicators leave broader welfare gains uncertain.","detail":"Geographic capability is not actual travel or access. Source-standardized clinical measures depend on patient mix. The program is mapping the manuscript, not certifying a welfare conclusion.","scope":"Interpretation beyond recorded facility supply","status":"limitation","basis":"paper_explicit","page":28,"quote":"whether entrants bring\nadditional patients into home dialysis or primarily serve patients transferring from other providers"},{"id":"weak_test","kind":"limitation","label":"Average-score RI does not directly test a heterogeneous zero average","summary":"The average-score statistic is calibrated under no assignment effect for every represented unit and year. It does not automatically test the weaker hypothesis of a zero average with offsetting effects.","detail":"A significant average-score test rejects the sharp hypothesis; it is not an omnibus test against every annual pattern. Undefined statistics are unavailable, not evidence of non-significance.","scope":"Meaning of significance for coefficient averages","status":"limitation","basis":"paper_explicit","page":12,"quote":"does not\nby itself test the weaker hypothesis of a zero average effect with offsetting heterogeneous effects"}],"relations":[{"id":"random_target","from":"assignment","to":"target","type":"identifies","label":"Geographic randomization supplies the comparison","explanation":"Assignment supplies identifying variation for the ITT, subject to the stated observation, measurement and interference conditions.","basis":"map_interpretation","page":11,"quote":"With assignment-invariant observation\nand sample membership"},{"id":"assigned_exposure","from":"assignment","to":"exposure","type":"implements","label":"Assignment determines eligibility for ETC","explanation":"Eligible providers in selected HRRs participate; assignment is geographic, not a randomized facility opening.","basis":"map_interpretation","page":4,"quote":"Participation was mandatory for eligible providers in selected HRRs"},{"id":"bundle","from":"exposure","to":"phases","type":"implements","label":"Exposure includes both payment schedules","explanation":"ETC combines the temporary home payment bonus and performance incentives.","basis":"map_interpretation","page":4,"quote":"ETC combines a temporary bonus on home-dialysis payments with performance-based adjust-\nments"},{"id":"phase_qualification","from":"phase_limit","to":"phases","type":"qualifies","label":"Component-specific effects are unresolved","explanation":"The bundled treatment and changing cohort age do not identify a separate HDPA or PPA mechanism.","basis":"map_interpretation","page":5,"quote":"Separating the effects of HDPA, PPA, and investment at entry requires independent variation"},{"id":"scope_rosters","from":"scope","to":"fixed_rosters","type":"implements","label":"Reporting eligibility defines all rosters","explanation":"Fixed cohorts and incumbents share the Form 265 population definition, which includes chain-owned facilities.","basis":"map_interpretation","page":6,"quote":"I apply the form’s\nreporting-category scope to entry counts, established facilities, market totals"},{"id":"identity","from":"sources","to":"identity_assumption","type":"requires","label":"Administrative histories need a physical-site interpretation","explanation":"Certification histories alone are insufficient; dated corroboration and unresolved identity flags qualify physical entry.","basis":"map_interpretation","page":7,"quote":"afirstcertificationdatealonedoesnotestablishthatanewlocationopened"},{"id":"roster_totals","from":"fixed_rosters","to":"cohort_ols","type":"implements","label":"Fixed roster contributions form the dependent variable","explanation":"The cohort total follows original entrants, keeping known nonproviders and later exits.","basis":"map_interpretation","page":7,"quote":"Original eligible cohort size"},{"id":"activity_totals","from":"measurement","to":"zero_missing","type":"implements","label":"Observed activity and known zeros define totals","explanation":"Positive activity, empty-cohort zeros and unresolved quantity are kept distinct in aggregation.","basis":"map_interpretation","page":8,"quote":"An empty local entry cohort has a known zero\ncontribution"},{"id":"cohort_target","from":"cohort_ols","to":"target","type":"implements","label":"Equation 2 estimates recorded cohort ITT","explanation":"Additive comparisons use baseline market outcomes and predetermined controls within randomization regions.","basis":"map_interpretation","page":11,"quote":"I estimate the effect of ETC assignment on the total home dialysis service supplied by each fixed\nentry cohort"},{"id":"ols_adjust","from":"covariates","to":"cohort_ols","type":"implements","label":"Predetermined adjustment enters each cohort-year equation","explanation":"Both the baseline-outcome slope and control slopes vary by cohort and observation year.","basis":"map_interpretation","page":11,"quote":"Baseline slopes and the\neight control slopes vary by cohort and observation year"},{"id":"panel_adjust","from":"covariates","to":"panel","type":"implements","label":"Baseline characteristics predict annual paths","explanation":"The incumbent and market panel uses year-specific control interactions alongside HRR and region-year effects.","basis":"map_interpretation","page":11,"quote":"allow baseline characteristics to predict different annual paths"},{"id":"average_cohort","from":"averages","to":"cohort_ols","type":"implements","label":"Main cohort averages combine annual coefficients","explanation":"Coefficients receive equal weights over cohort-specific windows, with covariance retained.","basis":"map_interpretation","page":12,"quote":"Main tables average annual coefficients equally and retain their covariance\nwithin HRRs"},{"id":"inference_assign","from":"ri","to":"assignment","type":"implements","label":"Inference preserves the full regional assignment mechanism","explanation":"Treatment counts are preserved in all 302 HRRs, including when a regression uses only a subset.","basis":"map_interpretation","page":43,"quote":"Randomization inference preserves the original regional treatment totals over all 302 HRRs"},{"id":"ri_observation","from":"ri","to":"observation_assumption","type":"requires","label":"Fixed masks require counterfactual invariance","explanation":"Keeping the observed mask fixed in the calculation does not establish that its membership or measurement is invariant to assignment.","basis":"map_interpretation","page":44,"quote":"fixing the observed\nmask in the computation does not establish that condition"},{"id":"itt_observation","from":"target","to":"observation_assumption","type":"requires","label":"Recorded ITT needs assignment-invariant observation","explanation":"Selection and measurement can both respond to assignment and qualify the interpretation.","basis":"map_interpretation","page":11,"quote":"With assignment-invariant observation\nand sample membership"},{"id":"itt_interference","from":"target","to":"interference_assumption","type":"requires","label":"Cross-HRR behavior can affect the contrast","explanation":"Chains operating across both arms can change service in treated and control HRRs.","basis":"map_interpretation","page":12,"quote":"Chains spanning treated and control HRRs may\nchange service in both groups"},{"id":"itt_identity","from":"target","to":"identity_assumption","type":"requires","label":"Physical entry must match the classified roster","explanation":"Unresolved alias and same-site cases limit interpretation of administrative counts as new physical capacity.","basis":"map_interpretation","page":40,"quote":"Remaining alias and\nsame-site ambiguities limit interpretation of administrative facility counts"},{"id":"sample_limit","from":"selection_limit","to":"support","type":"qualifies","label":"Full-window support is selected after assignment","explanation":"A constant geographic sample can still be selected through treatment-responsive follow-up availability.","basis":"map_interpretation","page":12,"quote":"The fixed HRR samples are selected using follow-up availability"},{"id":"supply_measurement","from":"reporting_limit","to":"zero_missing","type":"qualifies","label":"Partial records can move the measured total","explanation":"Observed totals concern known recorded activity rather than fully observed supply.","basis":"map_interpretation","page":12,"quote":"totals sum known facility contributions"},{"id":"coverage_observation","from":"coverage","to":"observation_assumption","type":"assesses","label":"Coverage informs but does not settle observation concerns","explanation":"Coverage tables describe observed activity; high rates cannot establish ignorable missingness.","basis":"map_interpretation","page":12,"quote":"high coverage and imprecise coverage differences\ncannot establish that missingness is ignorable"},{"id":"coverage_missing","from":"coverage","to":"reporting_limit","type":"assesses","label":"Coverage describes remaining unreported activity","explanation":"Provision and quantity coverage are measured over required facility records in retained HRRs.","basis":"map_interpretation","page":43,"quote":"unreported activity remains unknown"},{"id":"balance_adjust","from":"balance","to":"covariates","type":"supports","label":"Baseline dispersion motivates precision adjustment","explanation":"The tables describe pre-policy dispersion and differences used for adjustment, not proof that every covariate is balanced.","basis":"map_interpretation","page":9,"quote":"The descriptive differences show the cross-market variation used for\nbaseline adjustment"},{"id":"hc2_ri","from":"hc2","to":"ri","type":"qualifies","label":"Intervals and RI stars answer different uncertainty questions","explanation":"The significance assessment uses reassignments, while HC2 intervals summarize coefficient uncertainty.","basis":"map_interpretation","page":12,"quote":"HC2 intervals\nsummarize uncertainty in the estimated average and can differ from the RI significance assessment"},{"id":"multiplicity","from":"multiple","to":"ri","type":"qualifies","label":"Individual stars do not control all map comparisons jointly","explanation":"The manuscript reports individual tests without simultaneous adjustment across outcomes.","basis":"map_interpretation","page":44,"quote":"Significance refers to individual comparisons without a simultaneous adjustment"},{"id":"weak_vs_sharp","from":"weak_test","to":"ri","type":"qualifies","label":"Interpret average-score rejection against its actual hypothesis","explanation":"A weak zero-average effect with heterogeneous offsets requires additional arguments.","basis":"map_interpretation","page":44,"quote":"validity for a weak zero-average\nnull with heterogeneous effects requires additional arguments"},{"id":"conditional_selection","from":"conditional_limit","to":"conditional","type":"qualifies","label":"Observed facilities can differ under assignment","explanation":"Entry and reporting selection prevent treating conditional contrasts as fixed-population facility effects.","basis":"map_interpretation","page":43,"quote":"Becauseentryandreportingcanrespond\nto assignment"},{"id":"window_conditioning","from":"windows","to":"conditional_limit","type":"qualifies","label":"Reporting and positive denominators narrow representation","explanation":"Full reports, matched records and positive denominators select different populations across outcomes.","basis":"map_interpretation","page":25,"quote":"Ratios require\njointly observed components and positive denominators, excluding empty cohorts"},{"id":"standardization","from":"cohort_ols","to":"standardize","type":"implements","label":"Predictions under each assignment reuse the main equations","explanation":"Count, provision and treatment equations are evaluated on common observed HRRs with equal weights.","basis":"map_interpretation","page":15,"quote":"Each count regression uses the same observed HRRs\nand equal weights as its paired service regression"},{"id":"accounting_levels","from":"standardize","to":"shapley","type":"implements","label":"Adjusted quantities define count and rate components","explanation":"Ratios of standardized quantities and counts generate the decomposition rates.","basis":"map_interpretation","page":16,"quote":"These adjusted levels supply the counts and service rates\nneeded for the decomposition"},{"id":"accounting_not_mediation","from":"mediation_limit","to":"shapley","type":"qualifies","label":"Arithmetic allocation does not identify causal channels","explanation":"Component changes can arise from entrant composition or operating behavior.","basis":"map_interpretation","page":17,"quote":"Theseareaccountingallocations"},{"id":"component_bounds","from":"bounds","to":"mediation_limit","type":"assesses","label":"Component uncertainty further limits literal rate interpretation","explanation":"Bounds and bootstrap diagnostics assess the stability of accounting quantities; they do not supply causal mediation identification.","basis":"map_interpretation","page":89,"quote":"limiting a literal\ncount-and-rate interpretation in those draws"},{"id":"functional_form","from":"ppml_check","to":"cohort_ols","type":"addresses","label":"Alternative conditional mean probes the linear specification","explanation":"PPML allows a proportional response while preserving much of the main design; separation can change support.","basis":"map_interpretation","page":25,"quote":"PPML allows assignment to change\nthe conditional mean proportionally"},{"id":"market_leverage","from":"large_check","to":"cohort_ols","type":"addresses","label":"Large-market exclusion probes sensitivity","explanation":"Removing the largest markets shows whether the 2021 estimates and their precision depend on those observations.","basis":"map_interpretation","page":26,"quote":"their statistical precision is\nsensitive to those observations"},{"id":"complete_reporting","from":"complete_check","to":"reporting_limit","type":"assesses","label":"Complete records probe observed reporting sensitivity","explanation":"This check removes unresolved facility-years at the cost of narrower selected samples; the missingness process remains unresolved.","basis":"map_interpretation","page":26,"quote":"They cannot establish that missingness is\nrandom"},{"id":"extended_cohort","from":"followup","to":"cohort_ols","type":"addresses","label":"Additional year probes persistence on original support","explanation":"The extension adds available 2025 outcomes without selecting earlier observations on 2025 completeness.","basis":"map_interpretation","page":84,"quote":"all earlier observations, the main HRR lists, controls, and\nbaseline adjustments are retained"},{"id":"extended_policy","from":"phase_limit","to":"followup","type":"qualifies","label":"Additional follow-up also changes the policy horizon","explanation":"The termination announcement and further cohort aging affect interpretation of the extra year.","basis":"map_interpretation","page":27,"quote":"This extra year includes the announcement of early termination"},{"id":"recorded_welfare","from":"patient_limit","to":"target","type":"qualifies","label":"Recorded cohort care is narrower than patient welfare","explanation":"Transfers, new patients and welfare require evidence beyond facility contribution totals.","basis":"map_interpretation","page":28,"quote":"whether entrants bring\nadditional patients into home dialysis or primarily serve patients transferring from other providers"}],"caveats":["This map reports the methods in the supplied manuscript. It has not independently reproduced randomization, report reconciliation, regressions or bootstrap draws.","Randomized geography is distinct from randomization of who enters. The cohort ITT includes entry and composition; conditional facility and ratio contrasts additionally select the realized population.","A sample fixed in the observed data is not necessarily invariant under counterfactual assignment. Reporting selection and cross-HRR interference remain stated concerns.","Significance uses individual sharp-hypothesis RI tests at 10%, 5% and 1%. HC2 intervals, a heterogeneous average-effect hypothesis and simultaneous outcome inference are different objects.","Complete reporting and PPML checks can change sample support. Their results are sensitivity evidence, not proof that all identifying assumptions hold.","The source’s accounting decomposition is not causal mediation. Payment phases, entrant age and calendar conditions remain intertwined.","Assumptions labeled map interpretation reconstruct requirements from the author’s stated limitations. They are not new tests or author claims that those requirements have been verified."]},"checks":{},"demo":false}</script>

</script><script id="academic-map-shell">/* Navigation and optional animation around the supplied PaperBranch drawing functions. */
(() => {
  'use strict';
  const host = document.getElementById('paperbranch-viewer');
  const mode = document.body.dataset.mapView;
  const original = JSON.parse(document.getElementById('paperbranch-data').textContent);
  const view = mode === 'methods' ? original.methods : original;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let autoRotate = !reducedMotion.matches, animationFrame = null, lastFrame = null;
  let activeCanvas = null, inView = false;
  let initialized = false;
  const picker = () => host.querySelector('.detail-panel select');
  const autoButton = document.createElement('button');
  autoButton.type = 'button';
  autoButton.id = 'paper-auto-rotate';
  autoButton.addEventListener('click', () => setAuto(!autoRotate));
  function animate() {
    if (!autoRotate || !inView || document.hidden || animationFrame !== null) return;
    animationFrame = requestAnimationFrame(now => {
      animationFrame = null;
      if (!autoRotate || !inView || document.hidden) { lastFrame = null; return; }
      const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 50);
      lastFrame = now;
      // The original drag handler turns by 0.006 radians per pixel; one revolution per minute.
      activeCanvas?.dispatchEvent(new CustomEvent('paperbranch-auto-rotate', { detail: elapsed * Math.PI * 2 / 60000 / .006 }));
      animate();
    });
  }
  function setAuto(value) {
    autoRotate = value;
    lastFrame = null;
    if (animationFrame !== null) cancelAnimationFrame(animationFrame);
    animationFrame = null;
    autoButton.textContent = value ? 'Pause rotation' : 'Start rotation';
    autoButton.setAttribute('aria-pressed', String(value));
    if (value) animate();
  }
  const visibility = new IntersectionObserver(entries => {
    inView = entries.some(entry => entry.target === activeCanvas && entry.isIntersecting);
    lastFrame = null;
    if (!inView && animationFrame !== null) { cancelAnimationFrame(animationFrame); animationFrame = null; }
    animate();
  });

  function choose(id) {
    setAuto(false);
    const select = picker();
    if (!select || !Array.from(select.options).some(option => option.value === id)) return;
    select.value = id;
    select.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function closeDetails() {
    setAuto(false);
    const back = host.querySelector('.back-full-map');
    if (back) back.click();
    else choose('question:root');
  }
  function synchronize() {
    const tab = document.getElementById(mode === 'methods' ? 'methods-tab' : 'findings-tab');
    if (!tab) return;
    if (!initialized && tab.getAttribute('aria-selected') !== 'true') { tab.click(); return; }
    const select = picker();
    if (!select || !host.querySelector('canvas')) return;
    initialized = true;
    host.dataset.ready = 'true';
    const canvas = host.querySelector('canvas');
    if (canvas !== activeCanvas) {
      visibility.disconnect();
      activeCanvas = canvas;
      lastFrame = null;
      visibility.observe(canvas);
    }
    const toolbar = host.querySelector('.map-toolbar');
    if (toolbar && !toolbar.contains(autoButton)) toolbar.append(autoButton);
    const focused = host.querySelector('.offline-app')?.classList.contains('is-focused');
    const selected = focused || select.value !== 'question:root';
    document.body.toggleAttribute('data-detail-open', selected);
    const panel = select.closest('.detail-panel');
    let close = panel.querySelector('.academic-close-detail');
    if (!close) {
      close = document.createElement('button');
      close.className = 'academic-close-detail';
      close.type = 'button';
      close.textContent = 'Close details';
      close.addEventListener('click', closeDetails);
      panel.prepend(close);
    }
    close.hidden = !selected;
    const branch = host.querySelector('.map-toolbar select');
    if (branch) branch.setAttribute('aria-label', mode === 'methods' ? 'Method branch' : 'Research branch');
  }

  const index = document.createElement('details');
  index.className = 'node-index';
  const summary = document.createElement('summary');
  summary.textContent = `Browse all ${view.nodes.length} nodes`;
  const list = document.createElement('div');
  list.className = 'node-index-list';
  view.nodes.forEach(node => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = node.label;
    button.addEventListener('click', () => {
      choose(node.id);
      host.querySelector('.graph-area')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    list.append(button);
  });
  index.append(summary, list);
  // Outside the React root: every original node has a readable, untruncated entry.
  host.after(index);
  const container = document.createElement('div');
  container.className = 'offline-app node-index-container';
  index.replaceWith(container);
  container.append(index);
  document.querySelector('[data-open-node]')?.addEventListener('click', event => choose(event.currentTarget.dataset.openNode));
  host.addEventListener('pointerdown', event => { if (!autoButton.contains(event.target)) setAuto(false); }, true);
  host.addEventListener('change', () => setAuto(false), true);
  host.addEventListener('keydown', event => { if (event.target !== autoButton) setAuto(false); }, true);
  host.addEventListener('wheel', event => { if (event.target.closest('.graph-area')) setAuto(false); }, { capture: true, passive: true });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeDetails(); });
  document.addEventListener('visibilitychange', () => {
    lastFrame = null;
    if (document.hidden && animationFrame !== null) { cancelAnimationFrame(animationFrame); animationFrame = null; }
    animate();
  });
  reducedMotion.addEventListener('change', event => { if (event.matches) setAuto(false); });
  new MutationObserver(synchronize).observe(host, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'aria-selected'] });
  setAuto(autoRotate);
  synchronize();
})();
</script></body></html>
