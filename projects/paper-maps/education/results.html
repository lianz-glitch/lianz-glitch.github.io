ainment is 29.34% at age 25 and 40.80% at age 35; this is descriptive, not a policy effect.","outcome":"BA+ attainment","population":"1985–1987 cohorts, full-population ACS","period":"Ages 25–35; ACS 2000–2022","direction":"increase","finding":"descriptive","inference":"not_applicable","statistic":"29.34% at 25; 40.80% at 35","page":4,"quote":"BA+ rises from 29.34 percent at 25 to 40.80 percent at 35"},{"id":"f4","domainId":"paths","sourceId":"li","kind":"focal_main","label":"Age-25 moments admit opposite NPV signs","summary":"Each of three stipulated schooling scenarios has compatible age-25-only paths with positive and negative NPV under a common valuation rule.","outcome":"Education-channel NPV","population":"Three deterministic scenarios, per person","period":"Age-25 restriction; valued through age 65","direction":"mixed","finding":"mixed","inference":"not_applicable","statistic":"$000: plateau [-6.28,46.44]; speed [-3.19,46.80]; timing [-24.11,43.16]","page":9,"quote":"produces both positive and negative values in all three displayed scenarios."},{"id":"f5","domainId":"paths","sourceId":"li","kind":"focal_secondary","label":"Age-35 moment narrows three ranges","summary":"Adding age 35 reduces width 95.8%, 97.8% and 93.5% in three midpoint cases; timing still has both signs in three of five scenarios overall.","outcome":"Education NPV candidate range","population":"Three midpoint and five-per-group registered scenarios","period":"Age 25 versus ages 25 and 35","direction":"mixed","finding":"mixed","inference":"not_applicable","statistic":"Width reductions 95.8%, 97.8%, 93.5%; timing both-signs in 3/5","page":10,"quote":"reductions in width of 95.8, 97.8, and 93.5 percent."},{"id":"f6","domainId":"paths","sourceId":"li","kind":"focal_secondary","label":"Observation location affects restrictions","summary":"Median width reductions are 28.6–86.3% for age 20 plus 25 and 36.0–90.6% for age 24 plus 25; this is not a general design rule.","outcome":"Education NPV candidate-range width","population":"Three parameter groups and scenarios","period":"Age pairs within 18–35","direction":"decrease","finding":"descriptive","inference":"not_applicable","statistic":"Age 20+25: 28.6–86.3%; age 24+25: 36.0–90.6%","page":11,"quote":"The age-24 pair is more informative than the age-20 pair"},{"id":"f7","domainId":"paths","sourceId":"angrist","kind":"prior_result","label":"STBF award raises six-year completion","summary":"For applicants targeting four-year colleges, awards raise BA completion 8.1 percentage points six years after high school; authors examine graduation dynamics and qualify extrapolation.","outcome":"BA completion","population":"Applicants targeting four-year colleges","period":"Six years after high school","direction":"increase","finding":"not_reported","inference":"author_causal_claim","statistic":"8.1 percentage points","page":4,"quote":"awards raise bachelor’s degree completion by 8.1 percentage points six years after high school."},{"id":"f8","domainId":"welfare","sourceId":"angrist","kind":"prior_result","label":"STBF reference MVPF is 1.75","summary":"The source projects a $21,150 lifetime earnings gain per award recipient and MVPF 1.75 under hypothetical public funding.","outcome":"Lifetime earnings and MVPF","population":"STBF four-year-college applicants, per recipient","period":"Lifetime projection; 3% discount rate","direction":"increase","finding":"descriptive","inference":"author_causal_claim","statistic":"$21,150; MVPF 1.75","page":4,"quote":"project a lifetime earnings gain of $21,150 per award recipient"},{"id":"f9","domainId":"welfare","sourceId":"li","kind":"focal_main","label":"STBF reconstructed MVPFs exceed one","summary":"Converted time-enrolled input yields $8.46–$60.26k earnings NPV and MVPFs 1.28–3.98; schooling conversion is an added assumption.","outcome":"Earnings NPV and MVPF","population":"2012–2014 four-year-college applicant strata","period":"Six-year input mapped to ages 23–25; valuation to 65", icy-specific reference and permanent plateau paths","direction":"mixed","finding":"descriptive","inference":"not_applicable","statistic":"18 finite pairs; 8 move from finite reference MVPF to self-financing; 7 self-financing in both accounts","page":19,"quote":"18 finite pairs, eight calculations that move from a finite reference MVPF to self-financing, and seven that are self-financing in both accounts."},{"id":"f25","domainId":"welfare","sourceId":"li","kind":"focal_main","label":"Temporary matches often place MVPF near one","summary":"Temporary speed and timing matches can generate dispersed earnings NPVs while reconstructed MVPFs cluster near one; these selected matched samples differ and do not show which continuation occurred.","outcome":"MVPF and earnings NPV under temporary changes","population":"20 finite speed pairs and 14 finite timing pairs","period":"Policy-specific lifetime valuation; speed and timing parameters","direction":"mixed","finding":"descriptive","inference":"not_applicable","statistic":"13/20 speed MVPFs and 9/14 timing MVPFs lie between 0.75 and 1.25","page":20,"quote":"13 of 20 temporary speed results and 9 of 14 temporary timing results lie between 0.75 and 1.25."},{"id":"f26","domainId":"welfare","sourceId":"li","kind":"focal_secondary","label":"Some parameter matches are unavailable","summary":"Within the policy collection, restricted one-parameter solutions are absent for some calculations; unmatched cases are not interpreted as zero responses, and the parameter-family samples differ.","outcome":"Existence of matched plateau, speed and timing solutions","population":"Policy calculations considered in Section 5.2","period":"Single-parameter policy-input matching exercise","direction":"not_reported","finding":"descriptive","inference":"not_applicable","statistic":"No matched solutions: 4 plateau, 11 speed, 19 timing calculations","page":20,"quote":"four, eleven, and nineteen calculations have no matched plateau, speed, or timing solution, respectively."},{"id":"f27","domainId":"welfare","sourceId":"li","kind":"focal_main","label":"Input summaries cross welfare thresholds","summary":"Across the specified L2 repetitions, MVPF summaries cross one in 36 of 37 reference accounts; WTP and net-cost summaries each cross zero in 34. Across all 38,000 scheduled runs, 37,952 produce finite path sets and 37,951 a defined MVPF. These are input-sensitivity summaries, not probabilities or confidence coverage.","outcome":"MVPF, WTP and net-cost repetition summaries","population":"37 policy calculations with reference accounts","period":"L2; 1,000 case-specific input repetitions","direction":"mixed","finding":"mixed","inference":"not_applicable","statistic":"Crossings: MVPF 36/37, WTP zero 34, net cost zero 34; finite paths 37,952/38,000; defined MVPF 37,951/38,000","page":20,"quote":"Under their specified repetition schemes, 36 of the 37 reference-account L2 summaries cross MVPF one."},{"id":"f28","domainId":"welfare","sourceId":"li","kind":"focal_secondary","label":"Seven added-window cases shift endpoint ranks","summary":"Among seven reference-account calculations admitting L3 under the common source-window rule, displayed priority improves in five and is unchanged in two under the specified endpoint ordering. This conditional ordering is not a welfare effect or certified ranking.","outcome":"Conditional endpoint-ordering priority","population":"Seven reference-account calculations admitting comparable L3 restrictions","period":"L2 versus L3 under the stated lower-endpoint ordering","direction":"mixed","finding":"descriptive","inference":"not_applicable","statistic":"Priority improves 5/7; unchanged 2/7","page":18,"quote":"improves its displayed priority in five and leaves it unchanged in two"},{"id":"f29","domainId":"paths","sourceId":"athey","kind":"prior_result","label":"Athey et al. link short and long horizons","summary":"The focal paper describes Athey et al. as combining short-term experimental proxies with longer-term observational data under surrogacy and comparability conditions; this is cited methodological context, not an education result.","outcome":"Identification of long-term treatment effects","population":"Short-term proxies and longer-term outcomes","period":"Experimental proxy and observational follow-up data","direction":"not_reported","finding":"descriptive","inference":"not_applicable","statistic":"Not reported in focal paper","page":3,"quote":"Athey et al. (2026) combine short-term experimental proxies with longer-term observational data under surrogacy and comparability conditions."},{"id":"f30","domainId":"paths","sourceId":"obradovic","kind":"prior_result","label":"Obradović studies temporal-link identification","summary":"The focal paper characterizes Obradović as studying identification under restrictions on temporal links; this is distinct from Athey et al.’s proxy-combination approach.","outcome":"Identification of long-term treatment effects","population":"Long-term outcomes linked across time","period":"Temporal links between short- and long-term data","direction":"not_reported","finding":"descriptive","inference":"not_applicable","statistic":"Not reported in focal paper","page":3,"quote":"Obradović (2026) studies identification under restrictions on temporal links"},{"id":"f31","domainId":"paths","sourceId":"fan","kind":"prior_result","label":"Fan et al. analyze surrogacy sensitivity","summary":"The focal paper describes Fan et al. as developing sensitivity analysis for departures from surrogacy; this addresses a separate uncertainty about short-to-long-term links.","outcome":"Sensitivity to surrogacy departures","population":"Long-term treatment-effect analyses using surrogate links","period":"Short- to long-term outcome extrapolation","direction":"not_reported","finding":"descriptive","inference":"not_applicable","statistic":"Not reported in focal paper","page":3,"quote":"Fan et al. (2026) develop sensitivity analysis for departures from surrogacy."}],"relations":[{"id":"r1","from":"f1","to":"f2","type":"related_outcome","label":"Timing and valuation coverage","explanation":"Both are counts in the selected register; career valuation does not imply several attainment ages.","basis":"paper_explicit","page":4,"quote":"Separately, 31 papers report education-based lifetime or career valuation."},{"id":"r2","from":"f3","to":"f4","type":"related_outcome","label":"Profile versus hypothetical paths","explanation":"ACS profiles describe attainment and inform calibration; age-path scenarios are deterministic reconstructions, not estimated policy responses.","basis":"map_comparison","page":6,"quote":"using the full-population data at ages 16–35"},{"id":"r3","from":"f4","to":"f5","type":"timing","label":"Age-35 moment narrows cases","explanation":"Three midpoint ranges narrow sharply, but three of five timing scenarios still have both signs; inference is conditional on path family and finite search.","basis":"paper_explicit","page":10,"quote":"three of the five timing scenarios still admit both signs after adding age 35."},{"id":"r4","from":"f5","to":"f6","type":"timing","label":"Observation location matters","explanation":"The source compares age pairs and finds different width reductions; no general sampling-design rule follows beyond the simulated logistic setting.","basis":"paper_explicit","page":11,"quote":"the ranking depends on the logistic family, anchor, and support."},{"id":"r5","from":"f7","to":"f9","type":"related_outcome","label":"Award moment enters valuation","explanation":"The reconstruction converts time enrolled into completed-schooling equivalents, an added assumption rather than a source-observed schooling stock.","basis":"paper_explicit","page":15,"quote":"This additional assumption permits the stock–flow valuation in Section 3."},{"id":"r6","from":"f8","to":"f9","type":"consistent","label":"Both STBF accounts exceed one","explanation":"Reference MVPF is 1.75 and reconstructed values 1.28–3.98; candidate magnitude varies, and conversions and valuation schedules differ.","basis":"map_comparison","page":15,"quote":"candidate MVPFs range from 1.28 to 3.98, compared with 1.75 in L1"},{"id":"r7","from":"f10","to":"f11","type":"related_outcome","label":"Eligibility evidence feeds account","explanation":"The policy-average account converts enrollment and completion margins to schooling equivalents; it differs from a local switcher illustration.","basis":"paper_explicit","page":5,"quote":"they project the associated earnings and tax changes"},{"id":"r8","from":"f11","to":"f12","type":"contrasting","label":"Adams L2 adds unresolved path cases","explanation":"Hendren and Sprung-Keyser’s reported policy-average MVPF is 0.72. The focal Adams L2 path comparison remains unresolved across compatible continuations; the separately assumed age-20 allocation is outside L3 and does not change that L2 finding.","basis":"paper_explicit","page":16,"quote":"The L2 candidates leave the welfare comparison unresolved."},{"id":"r9","from":"f13","to":"f14","type":"related_outcome","label":"Early outcome underlies projection","explanation":"Lifetime income and tax projections use early-adult effects; source acknowledges they do not settle permanence versus timing.","basis":"paper_explicit","page":5,"quote":"cannot fully distinguish lasting attainment gains from changes in the timing of schooling"},{"id":"r10","from":"f14","to":"f15","type":"contrasting","label":"Candidate paths differ from reference","explanation":"Focal candidates include positive-cost values below one and other fiscal states. They are conditional alternative continuations, not conflicting causal estimates.","basis":"map_comparison","page":17,"quote":"Earlier observations remove some adverse candidates"},{"id":"r11","from":"f16","to":"f17","type":"related_outcome","label":"Threshold differs from component signs","explanation":"MVPF threshold pairs and monetary sign pairs are related but separately counted outcomes.","basis":"paper_explicit","page":18,"quote":"The uncertainty can concern the signs of the monetary components"},{"id":"r12","from":"f16","to":"f20","type":"measure_check","label":"Narrow support lowers count","explanation":"Common narrow-support sensitivity reduces both-side threshold cases; it does not validate the path family.","basis":"paper_explicit","page":22,"quote":"narrowing empirical support reduces that count to 22."},{"id":"r13","from":"f16","to":"f27","type":"related_outcome","label":"Point inputs versus repetitions","explanation":"Threshold count fixes point inputs; repetitions vary case-specific source or constructed inputs and do not assign path probabilities.","basis":"paper_explicit","page":21,"quote":"These counts describe how the reconstructed endpoints respond to the inputs being varied."},{"id":"r14","from":"f22","to":"f1","type":"contrasting","label":"Florida has several windows","explanation":"Multiple cumulative-credit horizons illustrate timing information in some reviewed studies; this credit outcome differs from the BA+ denominator.","basis":"map_comparison","page":73,"quote":"cumulative effects of 1.098, 2.666, 3.847, and 4.366 credits"},{"id":"r15","from":"f18","to":"f16","type":"related_outcome","label":"Ratios can be unstable","explanation":"Near-zero positive costs can create wide or unbounded ratios even when WTP and costs remain finite; hence component signs are reported separately.","basis":"paper_explicit","page":18,"quote":"both monetary components remain finite."},{"id":"r16","from":"f21","to":"f3","type":"subgroup","label":"Sex paths use subgroup evidence","explanation":"Appendix G uses published sex-specific effects and matched baselines; the descriptive pooled ACS profile does not substitute for sex-specific source effects.","basis":"paper_explicit","page":95,"quote":"This appendix uses published subgroup treatment effects"},{"id":"r17","from":"f15","to":"f23","type":"timing","label":"Earlier windows form Tennessee L3","explanation":"L3 retains latest Tennessee effects and adds fifteen earlier windows. Its approximately 0.63 positive-cost endpoint is conditional on inward digitization; extraction sensitivity places it on different sides of one.","basis":"paper_explicit","page":17,"quote":"L3 adds fifteen earlier age-window estimates using the source’s marginal permutation intervals, while retaining the latest effects exactly."},{"id":"r18","from":"f24","to":"f25","type":"contrasting","label":"Permanent and temporary matches differ","explanation":"Permanent plateau matches broadly retain the reference MVPF pattern, while temporary speed/timing matches often lie near one despite dispersed NPVs. The samples differ, and neither pattern identifies the actual continuation.","basis":"paper_explicit","page":20,"quote":"The matched samples differ, which limits comparisons of the plotted patterns."},{"id":"r19","from":"f24","to":"f26","type":"uncertain","label":"No-match cases limit comparison","explanation":"Some calculations have no single-parameter match; absence of a solution within empirical support is not a zero response and limits cross-family comparisons.","basis":"paper_explicit","page":20,"quote":"Their absence is reported rather than interpreted as a zero response."},{"id":"r20","from":"f25","to":"f26","type":"uncertain","label":"Temporary samples are selected","explanation":"No-match cases differ across parameter families, limiting comparison of near-one MVPFs across their matched subsamples.","basis":"paper_explicit","page":20,"quote":"The matched samples differ, which limits comparisons of the plotted patterns."},{"id":"r21","from":"f16","to":"f28","type":"related_outcome","label":"Threshold ambiguity and ranks differ","explanation":"The 27/37 count records opposite-side MVPF candidates at fixed L2 inputs; the seven-case comparison applies an endpoint-ordering rule using L3 where available. The conditional ranking is not a welfare effect.","basis":"paper_explicit","page":18,"quote":"This is a consequence of how the selected endpoints change under the stated rule, not evidence that information raises true welfare."},{"id":"r22","from":"f29","to":"f4","type":"related_outcome","label":"Proxy literature frames education paths","explanation":"Athey et al. provide cited context on linking short-term proxies to longer outcomes; the focal application instead asks how observed education-age moments restrict earnings and fiscal paths. The cited study was not independently reviewed.","basis":"paper_explicit","page":3,"quote":"I examine a particular economic application of that problem: how the age profile of attained education affects earnings and fiscal valuation."},{"id":"r23","from":"f30","to":"f4","type":"related_outcome","label":"Temporal links frame path question","explanation":"The cited temporal-link identification literature motivates the focal question about unobserved education continuation, while the focal paper constructs conditional paths under its own explicit family.","basis":"paper_explicit","page":3,"quote":"I examine a particular economic application of that problem: how the age profile of attained education affects earnings and fiscal valuation."},{"id":"r24","from":"f31","to":"f4","type":"related_outcome","label":"Surrogacy sensitivity and continuation","explanation":"Fan et al.’s cited sensitivity work concerns departures from surrogacy; the focal analysis studies path uncertainty in a different education and welfare application.","basis":"paper_explicit","page":3,"quote":"I examine a particular economic application of that problem: how the age profile of attained education affects earnings and fiscal valuation."}],"caveats":["Maps the supplied paper and selected cited accounts, not the whole literature; cited findings are not independently rechecked against those papers.","The 459-paper register is selected; 38 policy calculations include shared study families and are not independent studies.","Finite candidate paths depend on logistic shape, ACS transport, outcome conversions and accounting assumptions; ranges are neither probabilities nor certified bounds.","Source estimates are taken as inputs; comparability of added windows depends on outcome, population and time mapping."],"methods":{"summary":"The paper reviews selected evidence, takes source causal estimates as inputs and deterministically constructs logistic age paths matching outcome-specific moments under ACS calibration and shape restrictions. It values candidates and reconstructs 38 welfare accounts. No new causal regression, structural behavioral model, identified bound or confidence region is estimated.","classification":{"designs":[{"family":"other","role":"primary","label":"Conditional deterministic path reconstruction","scope":"Age-path NPVs and 38 policy reconstructions, conditional on retained source inputs","nodeIds":["m1","m3","m4","m5"]},{"family":"descriptive","role":"secondary","label":"Selected literature timing review","scope":"459-paper register and ACS profiles","nodeIds":["m2","m3"]}],"estimators":[{"family":"other","role":"primary","label":"Finite-grid search and welfare accounting","scope":"Deterministic compatible-path and paired WTP/cost calculations","nodeIds":["m5","m6","m7"]},{"family":"descriptive","role":"secondary","label":"Counts and profile summaries","scope":"Literature counts and ACS age profiles","nodeIds":["m2","m3"]}],"explanation":"The focal paper uses conditional path reconstruction and deterministic welfare accounting; cited causal designs supply inputs and are not re-estimated. Logistic paths are not structural econometric estimates, and finite-search extrema are not identified bounds."},"nodes":[{"id":"m1","kind":"estimand","label":"Conditional education-channel value","summary":"Target is how compatible unobserved age paths change earnings NPV and policy welfare.","detail":"Causal source effects remain inputs. Policy accounts replace selected earnings and tax components rather than re-estimating policy effects.","scope":"Synthetic schooling exercise and policy applications","status":"described","basis":"paper_explicit","page":1,"quote":"I ask whether compatible paths imply different net present values"},{"id":"m2","kind":"data","label":"Selected review register","summary":"447 journal studies plus 11 welfare-source studies and one author manuscript make 459 papers.","detail":"674 preliminary records were screened; 686 combined records include exclusions and duplicates. This selected sample does not estimate field prevalence.","scope":"12 journals, 2000–2025 plus additions","status":"described","basis":"paper_explicit","page":46,"quote":"The journal search covers 2000–2025"},{"id":"m3","kind":"data","label":"ACS age-profile calibration","summary":"Census–ACS weighted profiles supply comparison levels, shapes and empirical support.","detail":"The library has 10,920 fits across 52 geographic units, 35 cohorts and six outcomes. Repeated cross-sections are not individual histories; some profiles are borrowed or extrapolated.","scope":"Baseline and policy-specific external calibrations","status":"described","basis":"paper_explicit","page":65,"quote":"The library contains 10,920 fits across 52 geographic units, 35 birth cohorts, and six outcome definitions."},{"id":"m4","kind":"treatment","label":"Source-specific moment conversion","summary":"Reported effects become age stocks, weighted windows or flow-change restrictions.","detail":"Outcome definitions, source weights and clocks are retained when possible; credits, enrollment and credentials require case-specific bridges that may add assumptions.","scope":"Case-specific L2 inputs","status":"described","basis":"paper_explicit","page":7,"quote":"These restrictions preserve the source study’s outcome definition and time scale."},{"id":"m5","kind":"design","label":"Deterministic path design","summary":"A fixed comparison curve and target population pair with treated logistic paths matching retained moments.","detail":"The main simulation anchors at age 17 before first possible effect at 18. No probability distribution is assigned to paths.","scope":"Synthetic scenarios and policy candidate banks","status":"described","basis":"paper_explicit","page":7,"quote":"The first experiment fixes the observation age at 25 and varies the education process generating that observation."},{"id":"m6","kind":"estimator","label":"Finite deterministic candidate search","summary":"A Sobol shape grid and regular timing-speed grid find moment-matching paths.","detail":"Plateau is solved algebraically for fixed speed/timing pairs; saved witnesses are rebuilt and checked. Feasibility does not establish exhaustive coverage.","scope":"Main paths and collection calculations","status":"described","basis":"paper_explicit","page":66,"quote":"This design avoids a separate high-dimensional likelihood optimization for each draw."},{"id":"m7","kind":"estimator","label":"Path valuation and welfare accounts","summary":"Each candidate path is valued then paired with its WTP and public net cost.","detail":"Policy MVPFs use each path’s own numerator and denominator; transfers and education costs generally remain fixed unless case-specific mappings apply.","scope":"Education NPV through age 65; 38 policy calculations","status":"described","basis":"paper_explicit","page":64,"quote":"The numerator and denominator of each MVPF come from the same member of this set."},{"id":"m8","kind":"assumption","label":"No pre-effect or anticipation","summary":"Common anchor assumes no effect before the specified exposure age.","detail":"This is a maintained hypothetical path condition, not a claim that observed treatment and comparison samples have equal pre-policy means.","scope":"Simulation anchor age 17; application anchors vary","status":"assumed","basis":"paper_explicit","page":6,"quote":"I assume no policy effect or anticipation through τc"},{"id":"m9","kind":"estimator","label":"Three-parameter logistic path","summary":"Plateau, speed and timing parameters generate paths after the common anchor.","detail":"Normalization passes through the baseline at the anchor; this is a chosen continuation family, not a structural response model.","scope":"Synthetic and policy paths","status":"described","basis":"paper_explicit","page":6,"quote":"I represent the treated path with a three-parameter logistic continuation anchored to the comparison level."},{"id":"m10","kind":"assumption","label":"Maintained shape and support","summary":"Paths obey level, increment, parameter-domain and empirical-support restrictions.","detail":"Main schooling paths are nondecreasing, bounded between 0 and 25 years, with at most 1.5 annual increment; these conditions define candidates without establishing actual responses.","scope":"Simulation and policy-specific candidate banks","status":"assumed","basis":"paper_explicit","page":7,"quote":"They define which paths enter the comparison; satisfying them does not establish that a particular path is the response to an actual policy."},{"id":"m11","kind":"diagnostic","label":"Two age-moment exercises","summary":"One varies generating process at age 25; the other fixes paths and varies observed ages.","detail":"Stipulated moments hold exact to separate path uncertainty from sampling error; Table 1 uses three midpoint cases and Table 2 summarizes five scenarios per parameter group.","scope":"Synthetic simulation; observation ages 18–35","status":"described","basis":"paper_explicit","page":10,"quote":"The second experiment holds each generating path fixed and changes the observation ages"},{"id":"m12","kind":"robustness","label":"Comparable added source windows","summary":"L3 adds moments only when outcome, population and clock map compatibly, preserving L2 conditions.","detail":"Tennessee adds digitized earlier windows; STBF degree endpoints do not create another schooling moment without a cross-outcome link. Adams age allocation remains a separate sensitivity.","scope":"Seven reference-account L3 calculations","status":"described","basis":"paper_explicit","page":14,"quote":"L3 adds comparable source restrictions while preserving the L2 specification."},{"id":"m13","kind":"robustness","label":"Adams age allocation sensitivity","summary":"An early enrollment contribution is separately assigned to age 20 under assumed completion timing.","detail":"Enrollment within two years does not show that a schooling year was completed then; this is excluded from L3 and main ranks.","scope":"Adams Scholarship converted input","status":"described","basis":"paper_explicit","page":68,"quote":"These are temporal allocations of the source schooling conversion, not directly estimated annual YS effects."},{"id":"m14","kind":"diagnostic","label":"Permanent versus temporary matches","summary":"Single-parameter exercises match education inputs through plateau, speed or timing changes.","detail":"Two parameters are held at baseline; matched samples differ and no exercise identifies which mechanism occurred.","scope":"Cases with matched parameter-family solutions","status":"described","basis":"paper_explicit","page":19,"quote":"without treating the observed input as evidence that one particular parameter changed."},{"id":"m15","kind":"robustness","label":"Separate input repetitions","summary":"1,000 repetitions per calculation use different archived or constructed input perturbations.","detail":"Percentile endpoints depend on case-specific schemes; no common sampling interpretation or full-path confidence coverage follows.","scope":"38 cases; some L3 lacks joint repetitions","status":"described","basis":"paper_explicit","page":20,"quote":"The L2 and L3 panels instead summarize the existing 1,000 prespecified repetitions per calculation"},{"id":"m16","kind":"inference","label":"Input uncertainty caveat","summary":"The focal analysis does not generate new standard errors or confidence regions for paths.","detail":"Covariance is incomplete for some cases and Tennessee normal perturbations are not source permutation draws.","scope":"Input-repetition summaries","status":"limitation","basis":"paper_explicit","page":22,"quote":"Different repetition schemes and incomplete covariance information preclude a common sampling interpretation."},{"id":"m17","kind":"data","label":"STBF randomized offer input","summary":"Cited Nebraska study randomly assigns scholarship offers; focal analysis retains selected four-year strata.","detail":"Randomization identifies the source offer contrast, not a design newly estimated in the focal paper.","scope":"2012–2014 four-year applicant strata; six-year outcomes","status":"described","basis":"paper_explicit","page":14,"quote":"Awards are randomly assigned among Nebraska applicants"},{"id":"m18","kind":"data","label":"Adams threshold input","summary":"Cited study uses test-score eligibility thresholds for scholarship effects.","detail":"The source RD contrast is input to the reconstruction; statewide ACS baseline does not represent marginal students by construction.","scope":"Massachusetts 2005–2006 graduates near cutoff","status":"described","basis":"paper_explicit","page":15,"quote":"use test-score eligibility thresholds to estimate the effects"},{"id":"m19","kind":"data","label":"Tennessee program input","summary":"Tennessee source studies overlapping age groups and cohort exposure, with state and survey-year fixed effects.","detail":"Focal external control calibration is not a fitted untreated DID trajectory; fixed effects alone are not classified as a focal DiD design.","scope":"Tennessee Promise high-school graduates","status":"described","basis":"paper_explicit","page":69,"quote":"The regressions include state and survey-year fixed effects."},{"id":"m20","kind":"limitation","label":"Finite search is not exhaustive","summary":"The search verifies witnesses but does not certify global extrema or absence of other paths.","detail":"Candidates on one side do not show every compatible continuation lies there; endpoint spans summarize found paths.","scope":"All finite path ranges","status":"limitation","basis":"paper_explicit","page":66,"quote":"These checks establish feasibility of saved witnesses, not exhaustive coverage of the continuous set."},{"id":"m21","kind":"assumption","label":"Schooling-to-cost bridge","summary":"Completed schooling flow proxies the timing of forgone work under a calibrated cost rule.","detail":"Enrollment and completion can differ and leavers need not work; common cost is a decomposition calibration, not policy-specific source estimate.","scope":"Education-channel NPVs and policy replacements","status":"assumed","basis":"paper_explicit","page":55,"quote":"an additional completed year recorded at age a as a proxy for schooling that displaces earnings at that age."},{"id":"m22","kind":"limitation","label":"External profile transport","summary":"ACS profiles are external references, not untreated predictions for every policy population.","detail":"State means may not represent applicants; historic cohorts can borrow shapes and extrapolate, and repeated cross-sections can reflect composition change.","scope":"Policy comparison paths","status":"limitation","basis":"paper_explicit","page":21,"quote":"a statewide mean need not represent scholarship applicants or marginal students."},{"id":"m23","kind":"limitation","label":"Interpretation remains conditional","summary":"Opposite candidate classifications show unresolved judgment, not which path occurred or its likelihood.","detail":"Alternative path families, later outcomes and observed earnings could test separate assumptions; ranges are not certified bounds.","scope":"All simulations and policy applications","status":"limitation","basis":"paper_explicit","page":23,"quote":"It does not establish how likely either path is."}],"relations":[{"id":"mr1","from":"m2","to":"m1","type":"qualifies","label":"Review is descriptive","explanation":"Review records timing and valuation coverage without reassessing source identification or estimating prevalence for all research.","basis":"paper_explicit","page":46,"quote":"does not reassess each study’s causal identification."},{"id":"mr2","from":"m3","to":"m5","type":"implements","label":"ACS sets comparison profiles","explanation":"External profiles supply baseline levels, shapes and support with transport limits.","basis":"paper_explicit","page":65,"quote":"Person weights form outcome means within state–birth-cohort–age cells"},{"id":"mr3","from":"m5","to":"m1","type":"identifies","label":"Design targets conditional value","explanation":"The design asks how matching paths alter valuation, not the original policy effect.","basis":"paper_explicit","page":7,"quote":"candidate ranges describe conditional possibilities"},{"id":"mr4","from":"m4","to":"m5","type":"implements","label":"Moments define compatibility","explanation":"Source-specific stocks, averages and flows constrain candidate paths.","basis":"paper_explicit","page":7,"quote":"An education estimate restricts a feature of ΔHc rather than revealing the entire path."},{"id":"mr5","from":"m5","to":"m8","type":"requires","label":"Anchor assumes no anticipation","explanation":"Age-17 common anchor preceding age-18 exposure requires no earlier effect or anticipation.","basis":"paper_explicit","page":6,"quote":"I assume no policy effect or anticipation through τc"},{"id":"mr6","from":"m5","to":"m9","type":"implements","label":"Logistic family generates paths","explanation":"Three parameters encode plateau, speed and timing.","basis":"paper_explicit","page":6,"quote":"They govern the plateau and the speed and timing of accumulation"},{"id":"mr7","from":"m9","to":"m10","type":"requires","label":"Paths obey restrictions","explanation":"Support and shape rules determine admissible candidates, not actual responses.","basis":"paper_explicit","page":7,"quote":"The admissible path class combines the logistic specification with restrictions"},{"id":"mr8","from":"m5","to":"m6","type":"implements","label":"Grid finds path witnesses","explanation":"Deterministic search finds candidates; rebuilt witnesses do not establish exhaustive coverage.","basis":"paper_explicit","page":66,"quote":"not exhaustive coverage of the continuous set."},{"id":"mr9","from":"m6","to":"m20","type":"qualifies","label":"Search may miss paths","explanation":"Finite grid cannot certify all extrema in the continuous family.","basis":"paper_explicit","page":66,"quote":"not exhaustive coverage of the continuous set."},{"id":"mr10","from":"m6","to":"m7","type":"implements","label":"Value each found path","explanation":"Each candidate feeds paired WTP and cost accounting.","basis":"paper_explicit","page":64,"quote":"The numerator and denominator of each MVPF come from the same member of this set."},{"id":"mr11","from":"m11","to":"m23","type":"assesses","label":"Age moments restrict ambiguity","explanation":"Fixed generating paths and varying moments compare candidate widths; they do not assess sampling precision or identify the true path.","basis":"paper_explicit","page":10,"quote":"holds each generating path fixed and changes the observation ages"},{"id":"mr12","from":"m12","to":"m4","type":"implements","label":"Comparable windows add moments","explanation":"L3 adds only source windows compatible in outcome, population and timing.","basis":"paper_explicit","page":14,"quote":"An additional restriction must follow from an actually reported stock or flow observation"},{"id":"mr13","from":"m13","to":"m12","type":"qualifies","label":"Age allocation remains separate","explanation":"Assumed completion timing is not a reported window and is excluded from L3.","basis":"paper_explicit","page":16,"quote":"This assignment therefore adds a completion-time assumption and is not admitted as L3"},{"id":"mr14","from":"m15","to":"m16","type":"qualifies","label":"Percentiles are not confidence regions","explanation":"Different repetition schemes do not establish common coverage for compatible paths.","basis":"paper_explicit","page":20,"quote":"do not share a sampling law or establish confidence coverage"},{"id":"mr15","from":"m17","to":"m4","type":"implements","label":"Randomized offer supplies input","explanation":"Focal path search retains randomized source effects rather than re-estimating them.","basis":"paper_explicit","page":14,"quote":"The reconstruction uses the 2012–2014 four-year-college strata"},{"id":"mr16","from":"m18","to":"m4","type":"implements","label":"Threshold effect supplies input","explanation":"Cited eligibility RD effects are converted into schooling restrictions for path search.","basis":"paper_explicit","page":15,"quote":"The estimates used here concern the 2005–2006 high-school graduating classes."},{"id":"mr17","from":"m19","to":"m3","type":"qualifies","label":"ACS is not untreated DID fit","explanation":"External control profiles do not reproduce source regression untreated predictions.","basis":"paper_explicit","page":69,"quote":"not a fitted untreated DID trajectory"},{"id":"mr18","from":"m3","to":"m22","type":"qualifies","label":"Population transport is limited","explanation":"External profiles may differ from selected or marginal study populations.","basis":"paper_explicit","page":65,"quote":"does not recover the regression’s conditional untreated prediction"},{"id":"mr19","from":"m7","to":"m21","type":"requires","label":"Valuation needs cost bridge","explanation":"Age-varying schooling valuation uses a proxy for forgone work under calibration.","basis":"paper_explicit","page":55,"quote":"as a proxy for schooling that displaces earnings at that age."},{"id":"mr20","from":"m6","to":"m23","type":"qualifies","label":"Conclusions are conditional","explanation":"Found conflicting paths do not establish their likelihood or actual occurrence.","basis":"paper_explicit","page":23,"quote":"It does not establish how likely either path is."}],"caveats":["Maps this paper and selected cited accounts, not all literature or independently verified causal evidence.","Source estimates are taken as inputs and not re-estimated; Tennessee fixed effects do not establish a focal DiD design.","Finite search and ACS calibration do not certify exhaustive sets, valid response shapes, identified bounds or confidence regions.","Conversions from enrollment, credits and degrees to schooling, age allocation and opportunity-cost valuation add assumptions.","Input repetitions use differing perturbation schemes and do not share a common sampling interpretation."]},"checks":{},"demo":false}</script>

</script><script id="academic-map-shell">/* Navigation and optional animation around the supplied PaperBranch drawing functions. */
(() => {
  'use strict';
  const host = document.getElementById('paperbranch-viewer');
  const mode = document.body.dataset.mapView;
  const original = JSON.parse(document.getElementById('paperbranch-data').textContent);
  const view = mode === 'methods' ? original.methods : original;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let autoRotate = !reducedMotion.matches, animationFrame = null, lastFrame = null;
  let activeCanvas = null, inView = false;
  let initialized = false;
  const picker = () => host.querySelector('.detail-panel select');
  const autoButton = document.createElement('button');
  autoButton.type = 'button';
  autoButton.id = 'paper-auto-rotate';
  autoButton.addEventListener('click', () => setAuto(!autoRotate));
  function animate() {
    if (!autoRotate || !inView || document.hidden || animationFrame !== null) return;
    animationFrame = requestAnimationFrame(now => {
      animationFrame = null;
      if (!autoRotate || !inView || document.hidden) { lastFrame = null; return; }
      const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 50);
      lastFrame = now;
      // The original drag handler turns by 0.006 radians per pixel; one revolution per minute.
      activeCanvas?.dispatchEvent(new CustomEvent('paperbranch-auto-rotate', { detail: elapsed * Math.PI * 2 / 60000 / .006 }));
      animate();
    });
  }
  function setAuto(value) {
    autoRotate = value;
    lastFrame = null;
    if (animationFrame !== null) cancelAnimationFrame(animationFrame);
    animationFrame = null;
    autoButton.textContent = value ? 'Pause rotation' : 'Start rotation';
    autoButton.setAttribute('aria-pressed', String(value));
    if (value) animate();
  }
  const visibility = new IntersectionObserver(entries => {
    inView = entries.some(entry => entry.target === activeCanvas && entry.isIntersecting);
    lastFrame = null;
    if (!inView && animationFrame !== null) { cancelAnimationFrame(animationFrame); animationFrame = null; }
    animate();
  });

  function choose(id) {
    setAuto(false);
    const select = picker();
    if (!select || !Array.from(select.options).some(option => option.value === id)) return;
    select.value = id;
    select.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function closeDetails() {
    setAuto(false);
    const back = host.querySelector('.back-full-map');
    if (back) back.click();
    else choose('question:root');
  }
  function synchronize() {
    const tab = document.getElementById(mode === 'methods' ? 'methods-tab' : 'findings-tab');
    if (!tab) return;
    if (!initialized && tab.getAttribute('aria-selected') !== 'true') { tab.click(); return; }
    const select = picker();
    if (!select || !host.querySelector('canvas')) return;
    initialized = true;
    host.dataset.ready = 'true';
    const canvas = host.querySelector('canvas');
    if (canvas !== activeCanvas) {
      visibility.disconnect();
      activeCanvas = canvas;
      lastFrame = null;
      visibility.observe(canvas);
    }
    const toolbar = host.querySelector('.map-toolbar');
    if (toolbar && !toolbar.contains(autoButton)) toolbar.append(autoButton);
    const focused = host.querySelector('.offline-app')?.classList.contains('is-focused');
    const selected = focused || select.value !== 'question:root';
    document.body.toggleAttribute('data-detail-open', selected);
    const panel = select.closest('.detail-panel');
    let close = panel.querySelector('.academic-close-detail');
    if (!close) {
      close = document.createElement('button');
      close.className = 'academic-close-detail';
      close.type = 'button';
      close.textContent = 'Close details';
      close.addEventListener('click', closeDetails);
      panel.prepend(close);
    }
    close.hidden = !selected;
    const branch = host.querySelector('.map-toolbar select');
    if (branch) branch.setAttribute('aria-label', mode === 'methods' ? 'Method branch' : 'Research branch');
  }

  const index = document.createElement('details');
  index.className = 'node-index';
  const summary = document.createElement('summary');
  summary.textContent = `Browse all ${view.nodes.length} nodes`;
  const list = document.createElement('div');
  list.className = 'node-index-list';
  view.nodes.forEach(node => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = node.label;
    button.addEventListener('click', () => {
      choose(node.id);
      host.querySelector('.graph-area')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    list.append(button);
  });
  index.append(summary, list);
  // Outside the React root: every original node has a readable, untruncated entry.
  host.after(index);
  const container = document.createElement('div');
  container.className = 'offline-app node-index-container';
  index.replaceWith(container);
  container.append(index);
  document.querySelector('[data-open-node]')?.addEventListener('click', event => choose(event.currentTarget.dataset.openNode));
  host.addEventListener('pointerdown', event => { if (!autoButton.contains(event.target)) setAuto(false); }, true);
  host.addEventListener('change', () => setAuto(false), true);
  host.addEventListener('keydown', event => { if (event.target !== autoButton) setAuto(false); }, true);
  host.addEventListener('wheel', event => { if (event.target.closest('.graph-area')) setAuto(false); }, { capture: true, passive: true });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeDetails(); });
  document.addEventListener('visibilitychange', () => {
    lastFrame = null;
    if (document.hidden && animationFrame !== null) { cancelAnimationFrame(animationFrame); animationFrame = null; }
    animate();
  });
  reducedMotion.addEventListener('change', event => { if (event.matches) setAuto(false); });
  new MutationObserver(synchronize).observe(host, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'aria-selected'] });
  setAuto(autoRotate);
  synchronize();
})();
