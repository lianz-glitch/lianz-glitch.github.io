ation","summary":"Cited findings on earnings associated with college completion or marginal admission."},{"id":"fertility","label":"Fertility","summary":"A cited result on marijuana legalization and fertility."},{"id":"arrests","label":"Drug-related arrests","summary":"A cited result on marijuana legalization and drug-related arrests."},{"id":"opioid_mortality","label":"Opioid mortality","summary":"A cited result on marijuana legalization and opioid-related mortality."}],"sources":[{"id":"focal","title":"Higher Education or Just Higher? The Unintended Effects of Recreational Marijuana Legalization","authors":"Anzheng Li","year":"","reference":"Focal paper","url":"","access":"focal_paper"},{"id":"marie","title":"High Achievers? Cannabis Access and Student Performance","authors":"Olivier Marie, U Zölitz","year":"2017","reference":"Marie and Zölitz (2017)","url":"","access":"cited_in_focal"},{"id":"wright","title":"Getting into the weeds: Does legal marijuana access blunt academic performance in college?","authors":"Adam C Wright, John M Krieg","year":"2020","reference":"Wright and Krieg (2020)","url":"","access":"cited_in_focal"},{"id":"chu_g","title":"High times: The effect of medical marijuana laws on student time use","authors":"Yu-Wei Luke Chu, Seth Gershenson","year":"2018","reference":"Chu and Gershenson (2018)","url":"","access":"cited_in_focal"},{"id":"plunk","title":"The impact of adolescent exposure to medical marijuana laws on high school completion, college enrollment and college degree completion","authors":"Andrew D Plunk, Arpana Agrawal, Paul T Harrell, William F Tate, Kelli England Will, Jennifer M Mellor, Richard A Grucza","year":"2016","reference":"Plunk et al. (2016)","url":"","access":"cited_in_focal"},{"id":"chu","title":"Do medical marijuana laws increase hard-drug use?","authors":"Yu-Wei Luke Chu","year":"2015","reference":"Chu (2015)","url":"","access":"cited_in_focal"},{"id":"ost","title":"The Returns to College Persistence for Marginal Studen ported","inference":"association","statistic":"The focal paper reports changes of −20% in educational activities and +20% in leisure.","page":15,"quote":"MML reduces the time students devote to educational activities by 20 percent and increases the time they spend on leisure activities by 20 percent"},{"id":"plunk_prior","domainId":"completion","sourceId":"plunk","kind":"prior_result","label":"Adolescent MML exposure predicts less completion","summary":"The focal paper says Plunk et al. find lower college degree completion among people exposed to MML during adolescence.","outcome":"College degree completion","population":"People exposed to MML during adolescence","period":"Later educational attainment; exact age/horizon not specified in focal account","direction":"decrease","finding":"not_reported","inference":"association","statistic":"Effect size and significance not supplied by focal paper.","page":21,"quote":"find lower college degree completion among those exposed to MML during adolescence"},{"id":"ost_prior","domainId":"earnings","sourceId":"ost","kind":"prior_result","label":"Below-threshold students earn less","summary":"The focal paper reports the earnings result from Ost et al.’s dismissal-threshold study; the cited account finds lower mid-run weekly earnings for students just below the threshold.","outcome":"Mid-run weekly earnings","population":"Students near university dismissal thresholds","period":"Mid-run; exact years not specified in focal account","direction":"decrease","finding":"not_reported","inference":"author_causal_claim","statistic":"About 5.6% lower weekly earnings.","page":12,"quote":"experience about a 5.6% reduction in mid-run weekly earnings"},{"id":"zimmerman_prior","domainId":"earnings","sourceId":"zimmerman","kind":"prior_result","label":"Marginal admission raises earnings","summary":"The focal paper reports that marginal admission to a four-year public university raises earnings.","outcome":"Earnings after marginal university admission","population":"Academically marginal students admitted to four-year public universities","period":"8–14 years after high school completion","direction":"increase","finding":"not_reported","inference":"author_causal_claim","statistic":"About 22% increase.","page":12,"quote":"marginal admission to a four-year public university raises earnings by about 22% between 8 and 14 years after high school completion"},{"id":"mj_ever","domainId":"cannabis","sourceId":"focal","kind":"focal_secondary","label":"Ever marijuana use is not significant","summary":"The baseline ATT is positive but not statistically significant. This is the baseline coding; a separate alternative consistent-ever-report robustness result is mapped separately.","outcome":"Indicator for ever marijuana use","population":"Individuals ages 18–24","period":"PSID 2011–2023","direction":"increase","finding":"not_significant","inference":"author_causal_claim","statistic":"Baseline: positive, not statistically significant.","page":17,"quote":"The estimated effect of RML on marijuana ever use is positive, but not statistically significant"},{"id":"mj_freq","domainId":"cannabis","sourceId":"focal","kind":"focal_main","label":"Marijuana frequency scores rise","summary":"Frequency scores rise significantly in all three windows; because nonusers are included, estimates do not isolate use intensity among users.","outcome":"Midpoint-coded marijuana frequency score","population":"Individuals ages 18–24","period":"Past 30 days, 12 months, and lifetime; PSID 2011–2023","direction":"increase","finding":"significant","inference":"author_causal_claim","statistic":"+1.26 (29%), +2.54 (36%), and +2.75 (26%) versus respective pre-means.","page":17,"quote":"RML significantly increases the frequency of marijuana use in the past 30 days, past 12 months, and over the lifetime"},{"id":"cocaine_ever","domainId":"substances","sourceId":"focal","kind":"focal_secondary","label":"Cocaine ever use rises","summary":"Ever cocaine use increases significantly.","outcome":"Indicator for ever cocaine use","population":"Individuals ages 18–24","period":"PSID 2011–2023","direction":"increase","finding":"significant","inference":"author_causal_claim","statistic":"+4.4 percentage points; 52% relative to pre-treatment mean 0.085.","page":18,"quote":"RML significantly increases ever use by 4.4 percentage points"},{"id":"cocaine_freq","domainId":"substances","sourceId":"focal","kind":"focal_secondary","label":"Cocaine frequency rises","summary":"Cocaine use-frequency scores increase significantly across each reported window.","outcome":"Midpoint-coded cocaine frequency score","population":"Individuals ages 18–24","period":"Past 30 days, 12 months, and lifetime; PSID 2011–2023","direction":"increase","finding":"significant","inference":"author_causal_claim","statistic":"+0.072, +0.322, +0.999; respectively 151%, 116%, 125% of pre-means.","page":18,"quote":"increases the frequency of cocaine use in the past 30 days, past 12 months, and over the lifetime"},{"id":"groupa_ever","domainId":"substances","sourceId":"focal","kind":"focal_secondary","label":"No significant Group A ever-use change detected","summary":"The estimate does not detect a statistically significant effect on ever use of amphetamines, barbiturates, or tranquilizers; this does not establish no effect. Some items include prescribed use.","outcome":"Indicator for ever use of Group A substances","population":"Individuals ages 18–24","period":"PSID 2011–2023","direction":"not_reported","finding":"not_significant","inference":"author_causal_claim","statistic":"No significant ATT reported.","page":18,"quote":"For Group A, RML has no statistically significant effect on ever use"},{"id":"groupa_freq","domainId":"substances","sourceId":"focal","kind":"focal_secondary","label":"Group A frequency scores rise","summary":"Frequency scores increase significantly across all reported windows. Group A combines amphetamines, barbiturates, and tranquilizers; some ite ,"period":"PSID 2011–2023","direction":"increase","finding":"significant","inference":"author_causal_claim","statistic":"+21.3 percentage points; 34% of pre-treatment mean 0.632.","page":18,"quote":"RML increases the probability of ever drinking by 21.3 percentage points"},{"id":"drink_quantity","domainId":"substances","sourceId":"focal","kind":"focal_secondary","label":"No significant drink-quantity change detected","summary":"The estimate does not detect a statistically significant effect on drinks per drinking day; event-study post-treatment signs are mixed. This does not establish no effect.","outcome":"Drinks per drinking day, including known nondrinking zeros","population":"Individuals ages 18–24","period":"PSID 2011–2023","direction":"mixed","finding":"not_significant","inference":"author_causal_claim","statistic":"ATT +0.057, not significant.","page":18,"quote":"RML has no statistically significant effect on drink quantity"},{"id":"smoking_ever","domainId":"substances","sourceId":"focal","kind":"focal_secondary","label":"Ever smoking increases","summary":"The ATT for ever smoking is positive and significant; individual post-treatment event-study estimates are not significant.","outcome":"Indicator for ever smoking cigarettes","population":"Individuals ages 18–24","period":"PSID 2011–2023","direction":"increase","finding":"significant","inference":"author_causal_claim","statistic":"+7.2 percentage points; 33% of pre-treatment mean 0.215.","page":18,"quote":"RML increases the probability of ever smoking by 7.2 percentage points"},{"id":"grossman_prior","domainId":"substances","sourceId":"grossman","kind":"prior_result","label":"Cocaine and marijuana are complements","summary":"The focal paper attributes evidence of complementarity in consumption to Grossman and Chaloupka.","outcome":"Cocaine and marijuana consumption","population":"Young adults; as identified by cited study title","period":"Not specified in focal account","direction":"increase","finding":"not_reported","inference":"association","statistic":"No magnitude or significance given in focal paper.","page":16,"quote":"provide evidence that cocaine and marijuana are complements in consumption"},{"id":"pacula_prior","domainId":"substances","sourceId":"pacula","kind":"prior_result","label":"Beer and cocaine complement marijuana","summary":"The focal paper says Pacula et al. find beer and cocaine may be complementary to marijuana use.","outcome":"Beer, cocaine, and marijuana consumption","population":"Youth; population scope as cited","period":"Not specified in focal account","direction":"increase","finding":"not_reported","inference":"association","statistic":"“May be” complementary; no magnitude or significance given.","page":16,"quote":"show that both beer and cocaine may be complementary to marijuana use"},{"id":"desimone_prior","domainId":"substances","sourceId":"desimone","kind":"prior_result","label":"Marijuana linked to cocaine initiation","summary":"The focal paper reports increased probability of cocaine initiation among individuals with no prior cocaine use.","outcome":"Cocaine initiation","population":"People with no prior cocaine use","period":"Subsequent initiation; exact follow-up not specified","direction":"increase","finding":"not_reported","inference":"association","statistic":"No magnitude or significance given in focal account.","page":17,"quote":"probability that individuals with no prior cocaine use initiate cocaine consumption"},{"id":"melberg_prior","domainId":"substances","sourceId":"melberg","kind":"prior_result","label":"Gateway pattern limited to high-risk youth","summary":"The focal paper describes a possible cannabis gateway effect concentrated in a small high-risk youth subgroup and weak, statistically insignificant for most youths.","outcome":"Hard-drug use following cannabis use","population":"Youth; concentrated in a small high-risk subgroup","period":"Not specified in focal account","direction":"mixed","finding":"mixed","inference":"association","statistic":"Weak and statistically insignificant for most youths.","page":17,"quote":"concentrated among a small subgroup of high-risk youths and is weak and statistically insignificant for most youths"},{"id":"hall_lyn_prior","domainId":"substances","sourceId":"hall_lyn","kind":"prior_result","label":"Earlier and frequent use predicts later drug use","summary":"The focal paper reports that marijuana use typically precedes other illicit drug use, and earlier initiation and greater frequency are associated with higher subsequent use probability.","outcome":"Subsequent use of other illicit substances","population":"Marijuana users; detailed population not specified in focal account","period":"Subsequent use; timing otherwise unspecified","direction":"increase","finding":"not_reported","inference":"association","statistic":"Association as reported; no causal estimate or magnitude supplied.","page":17,"quote":"earlier initiation and more frequent marijuana use are associated with a higher probability of subsequent use"},{"id":"chu_hard_prior","domainId":"substances","sourceId":"chu","kind":"prior_result","label":"MML raises marijuana proxies only","summary":"The focal paper says Chu finds MML increases proxies for marijuana consumption, with no evidence of increased cocaine or heroin use.","outcome":"Marijuana proxies; cocaine and heroin use","population":"Population not further specified in focal account","period":"MML; period not specified","direction":"mixed","finding":"not_reported","inference":"association","statistic":"No effect sizes or significance details supplied.","page":21,"quote":"MML increases proxies for marijuana consumption, but there is no evidence of increased cocaine or heroin use"},{"id":"wen_prior","domainId":"substances","sourceId":"wen","kind":"prior_result","label":"MML alcohol complementarity proposed","summary":"The focal paper invokes Wen et al. as suggesting a complementary relationship between marijuana and alcohol may help explain its drinking result.","outcome":"Marijuana and alcohol use","population":"Population not further specified in focal account","period":"MML context","direction":"increase","finding":"not_reported","inference":"association","statistic":"The focal paper gives no estimate or specific result beyond the suggested complementarity.","page":20,"quote":"a complementary relationship between marijuana and alcohol may help explain it, as Wen, Hockenberry and Cummings (2015) suggest for MML"},{"id":"menn_prior","domainId":"cannabis","sourceId":"menn","kind":"prior_result","label":"Perceived risk relates to cannabis use","summary":"The focal paper says prior evidence finds RML increases young people’s marijuana use and strengthens the relationship between low perceived risk and use after legalization.","outcome":"Marijuana use and perceived risk","population":"Young people; ages not specified in focal account","period":"After legalization","direction":"increase","finding":"not_reported","inference":"association","statistic":"Relationship strengthened; no magnitude supplied.","page":21,"quote":"RML increases marijuana use among young people and strengthens the relationship between low perceived risk and marijuana use after legalization"},{"id":"papich_fertility","domainId":"fertility","sourceId":"papich","kind":"prior_result","label":"Legalization reduces fertility","summary":"The focal paper reports Papich’s finding that marijuana legalization reduces fertility; it supplies no estimate or significance detail.","outcome":"Fertility","population":"Not specified in focal account","period":"Not specified in focal account","direction":"decrease","finding":"not_reported","inference":"association","statistic":"No magnitude or significance reported by focal paper.","page":4,"quote":"reduces fertility (Papich 2022)"},{"id":"sabia_arrests","domainId":"arrests","sourceId":"sabia","kind":"prior_result","label":"Legalization reduces drug arrests","summary":"The focal paper reports Sabia et al.’s finding that marijuana legalization reduces drug-related arrests; it supplies no estimate or significance detail.","outcome":"Drug-related arrests","population":"Not specified in focal account","period":"Not specified in focal account","direction":"decrease","finding":"not_reported","inference":"association","statistic":"No magnitude or significance reported by focal paper.","page":4,"quote":"drug-related arrests (Sabia et al. 2021)"},{"id":"mathur_opioids","domainId":"opioid_mortality","sourceId":"mathur","kind":"prior_result","label":"Legalization increases opioid mortality","summary":"The focal paper reports Mathur and Ruhm’s finding that marijuana legalization increases opioid-related mortality; it supplies no estimate or significance detail.","outcome":"Opioid-related mortality","population":"Not specified in focal account","period":"Not specified in focal account","direction":"increase","finding":"not_reported","inference":"association","statistic":"No magnitude or significance reported by focal paper.","page":4,"quote":"increases opioid-related mortality (Mathur and Ruhm 2023)"},{"id":"mj_ever_robust","domainId":"cannabis","sourceId":"focal","kind":"focal_secondary","label":"Ever use rises under consistent-history coding","summary":"In the robustness check that codes reports after first reported use consistently, marijuana ever use becomes positive and statistically significant. The author says this uncovers an extensive-margin effect but does not rule out reporting concerns.","outcome":"Indicator for ever marijuana use","population":"Individuals ages 18–24","period":"PSID 2011–2023; alternative consistent-ever coding","direction":"increase","finding":"significant","inference":"author_causal_claim","statistic":"ATT +0.060; statistically significant at 1% in Table A17, column 1.","page":19,"quote":"In Column (1), the estimated effect of RML on marijuana ever use is positive and statistically significant"},{"id":"mml_ba4","domainId":"completion","sourceId":"focal","kind":"focal_secondary","label":"MML lowers four-year completion","summary":"In the paper’s supplementary MML analysis, MML lowers BA completion within four years.","outcome":"BA completion within four years","population":"First-time, full-time entrants at four-year institutions in the MML analysis sample","period":"IPEDS 1997–2012; within 4 years","direction":"decrease","finding":"significant","inference":"author_causal_claim","statistic":"ATT −0.031; significant at 1%; pre-mean 0.295.","page":20,"quote":"MML lowers four-year completion and raises five-year completion, while the six-year estimate is statistically insignificant."},{"id":"mml_ba5","domainId":"completion","sourceId":"focal","kind":"focal_secondary","label":"MML raises five-year completion","summary":"In the paper’s supplementary MML analysis, five-year completion rises significantly.","outcome":"BA completion within five years","population":"First-time, full-time entrants at four-year institutions in the MML analysis sample","period":"IPEDS 1997–2012; within 5 years","direction":"increase","finding":"significant","inference":"author_causal_claim","statistic":"ATT +0.028; significant at 5%; pre-mean 0.471.","page":20,"quote":"MML lowers four-year completion and raises five-year completion, while the six-year estimate is statistically insignificant."},{"id":"mml_ba6","domainId":"completion","sourceId":"focal","kind":"focal_secondary","label":"MML six-year estimate is not significant","summary":"The supplementary MML six-year estimate is positive but not statistically significant.","outcome":"BA completion within six years","population":"First-time, full-time entrants at four-year institutions in the MML analysis sample","period":"IPEDS 1997–2012; within 6 years","direction":"increase","finding":"not_significant","inference":"author_causal_claim","statistic":"ATT +0.026; not statistically significant; pre-mean 0.517.","page":20,"quote":"MML lowers four-year completion and raises five-year completion, while the six-year estimate is statistically insignificant."},{"id":"cutoff_sensitivity","domainId":"completion","sourceId":"focal","kind":"focal_secondary","label":"Completion sensitivity across MML cutoffs","summary":"With cutoff years from 2005 to 2009, four- and five-year BA estimates are not significant; six-year BA and two-year graduation estimates remain significant across cutoffs.","outcome":"Graduation outcomes under alternative MML cutoff samples","population":"Institutions in alternative cutoff-year samples","period":"RML outcomes; cutoff years 2005–2009 and other reported alternatives","direction":"mixed","finding":"mixed","inference":"author_causal_claim","statistic":"Cutoff sensitivity: 4-/5-year BA significance is lost for 2005–2009; 6-year BA and two-year estimates remain significant throughout.","page":20,"quote":"the estimated effects are statistically insignificant when the cutoff year is set between 2005 and 2009"}],"relations":[{"id":"delay","from":"ba4","to":"ba5","type":"timing","label":"Partial catch-up by year five","explanation":"The five-year deficit is smaller than the four-year deficit; the paper interprets this as some delayed completers. This is not a matched individual transition estimate.","basis":"paper_explicit","page":10,"quote":"This attenuation suggests that some students induced not to graduate within four years eventually complete their degree within five years"},{"id":"persistence","from":"ba5","to":"ba6","type":"timing","label":"Deficit persists to year six","explanation":"The remaining significant six-year decline means the pattern is not only a four-year delay, though permanent noncompletion is an interpretation.","basis":"paper_explicit","page":10,"quote":"the impact of RML is not solely driven by delayed graduation"},{"id":"two_year_compare","from":"ba6","to":"two_year","type":"related_outcome","label":"Larger relative two-year decline","explanation":"Both completion outcomes decline; the paper says the two-year effect is larger relative to its baseline, while populations and programs differ.","basis":"paper_explicit","page":10,"quote":"This magnitude is substantially larger than the estimated effect on BA completion"},{"id":"gpa_enroll","from":"gpa","to":"enrollment","type":"uncertain","label":"Enrollment check is limited","explanation":"The insignificant short-series attendance estimate only partly addresses composition in the GPA sample; an earlier pre-treatment difference remains.","basis":"paper_explicit","page":14,"quote":"The attendance result offers only a limited check on selection into the GPA sample"},{"id":"gpa_ba","from":"gpa","to":"ba6","type":"related_outcome","label":"Performance aligns with completion","explanation":"Lower GPA among current students is consistent with reduced completion, but the focal paper does not estimate mediation and the samples differ.","basis":"paper_explicit","page":14,"quote":"These results do not establish how much of the graduation effect operates through academic performance"},{"id":"study_completion","from":"study_home","to":"ba6","type":"proposed_mechanism","label":"Study time as tentative pathway","explanation":"Less home study may undermine progress and completion; the paper frames this as a possible indirect mechanism, not demonstrated mediation.","basis":"paper_explicit","page":15,"quote":"students appear to devote less time to studying, particularly to self-directed study at home"},{"id":"passive_study","from":"study_home","to":"passive_leisure","type":"related_outcome","label":"Study and leisure move oppositely","explanation":"The two aggregate time-use estimates point in opposite directions, but do not show the same minutes were reallocated person by person.","basis":"paper_explicit","page":15,"quote":"RML reduces study time at home by 44.43 minutes"},{"id":"time_chu","from":"time_prior","to":"study_home","type":"consistent","label":"RML and MML time patterns align","explanation":"Both reports indicate less educational activity time under legalization; the focal RML measure isolates home study, unlike the cited MML aggregate.","basis":"paper_explicit","page":15,"quote":"effects of RML on students’ educational and leisure time allocation are larger in magnitude than those of MML"},{"id":"marijuana_cited","from":"mj_freq","to":"menn_prior","type":"related_outcome","label":"Risk beliefs are related evidence","explanation":"The focal paper reports increased marijuana frequency and separately describes Mennis et al.’s evidence about youth use and perceived risk. These are related outcomes; this comparison is constructed from the two reported findings.","basis":"map_comparison","page":21,"quote":"existing evidence shows that RML increases marijuana use among young people and strengthens the relationship between low perceived risk and marijuana use after legalization"},{"id":"cocaine_gateway","from":"cocaine_ever","to":"desimone_prior","type":"related_outcome","label":"Policy and individual-use outcomes","explanation":"The cited study concerns individual marijuana use and cocaine initiation; the focal estimate concerns RML’s effect on cocaine ever use. These are related designs and estimands.","basis":"map_comparison","page":18,"quote":"RML significantly increases ever use by 4.4 percentage points"},{"id":"harddrugs_contrast","from":"cocaine_freq","to":"chu_hard_prior","type":"contrasting","label":"RML and MML reports differ","explanation":"The focal paper reports cocaine-use increases under RML and no evidence of cocaine or heroin increases under MML. Different policies and cited measure details limit comparison.","basis":"paper_explicit","page":21,"quote":"Prior work finds no evidence that medical marijuana laws increase cocaine or heroin use"},{"id":"alcohol_wen","from":"alcohol_ever","to":"wen_prior","type":"related_outcome","label":"Alcohol result and proposed complement","explanation":"The focal paper invokes possible marijuana–alcohol complementarity in Wen et al. to interpret its RML drinking result; this is an explanatory suggestion, not confirmed mediation.","basis":"paper_explicit","page":20,"quote":"a complementary relationship between marijuana and alcohol may help explain it"},{"id":"earnings_context","from":"ba6","to":"ost_prior","type":"related_outcome","label":"Completion has labor-market stakes","explanation":"The cited threshold study links BA attainment and later earnings, providing context for possible consequences; it does not estimate RML’s earnings effect.","basis":"paper_explicit","page":12,"quote":"even a modest reduction in BA completion can translate into sizable cumulative earnings losses over time"},{"id":"zimmerman_returns","from":"ba6","to":"zimmerman_prior","type":"related_outcome","label":"Completion has earnings stakes","explanation":"The cited marginal-admission study reports later earnings gains, while the focal estimate concerns BA completion under legalization. It provides context for potential stakes; it does not estimate RML’s earnings effect.","basis":"paper_explicit","page":12,"quote":"marginal admission to a four-year public university raises earnings by about 22%"},{"id":"mj_ever_measure","from":"mj_ever","to":"mj_ever_robust","type":"measure_check","label":"Alternative ever-use coding","explanation":"The baseline ever-use ATT is positive but not significant; coding reports after the first positive report consistently yields a significant positive estimate. The comparison reflects a reporting-history check, not proof of initiation.","basis":"paper_explicit","page":19,"quote":"accounting for the second type of reporting bias uncovers an extensive-margin effect of RML on marijuana use"},{"id":"cutoff_check_ba4","from":"ba4","to":"cutoff_sensitivity","type":"measure_check","label":"Alternative sample cutoff check","explanation":"The baseline four-year effect is significant, but it loses significance for cutoff years 2005–2009. Those cutoffs change the eligible states, cohorts, and sample size.","basis":"paper_explicit","page":20,"quote":"estimated effects are statistically insignificant when the cutoff year is set between 2005 and 2009"},{"id":"rml_mml_four","from":"mml_ba4","to":"ba4","type":"consistent","label":"Both policies lower four-year completion","explanation":"Both paper estimates are negative for four-year BA completion. They concern different policies and sample periods, so this is a directional comparison rather than an equal-effect claim.","basis":"map_comparison","page":20,"quote":"MML lowers four-year completion and raises five-year completion, while the six-year estimate is statistically insignificant."},{"id":"rml_mml_five","from":"mml_ba5","to":"ba5","type":"contrasting","label":"Five-year estimates differ in direction","explanation":"The supplementary MML estimate is positive and the RML estimate is negative, but the policies and estimation samples differ; this is not a like-for-like contradiction.","basis":"map_comparison","page":20,"quote":"MML lowers four-year completion and raises five-year completion, while the six-year estimate is statistically insignificant."},{"id":"substance_to_completion","from":"cocaine_ever","to":"ba6","type":"proposed_mechanism","label":"Possible substance-use pathway","explanation":"The paper proposes other substance use as a possible pathway to educational outcomes. Cocaine is measured for ages 18–24 while completion is measured at institutions, and the data do not identify how much of the education effect operates through cocaine use.","basis":"paper_explicit","page":3,"quote":"The available data do not establish that increased use of other drugs causes the estimated decline in educational attainment"},{"id":"cannabis_to_completion","from":"mj_freq","to":"ba6","type":"proposed_mechanism","label":"Possible marijuana-use pathway","explanation":"The paper discusses increased marijuana use as a possible channel for education effects. The individual frequency-score sample differs from the institutional completion sample, and mediated effects are not estimated.","basis":"paper_explicit","page":20,"quote":"These policy effects on substance use do not identify how much of the educational effect operates through any particular substance"},{"id":"fertility_literature","from":"mj_freq","to":"papich_fertility","type":"related_outcome","label":"Shared legalization literature: fertility","explanation":"The paper says its results complement the broader marijuana-legalization literature. These are distinct outcomes under a shared policy topic; the findings do not imply causal links between outcomes or comparable effect sizes.","basis":"map_comparison","page":4,"quote":"reduces fertility (Papich 2022) and drug-related arrests (Sabia et al. 2021), increases opioid-related mortality (Mathur and Ruhm 2023)"},{"id":"arrests_literature","from":"mj_freq","to":"sabia_arrests","type":"related_outcome","label":"Shared legalization literature: arrests","explanation":"The paper says its results complement the broader marijuana-legalization literature. These are distinct outcomes under a shared policy topic; the findings do not imply causal links between outcomes or comparable effect sizes.","basis":"map_comparison","page":4,"quote":"reduces fertility (Papich 2022) and drug-related arrests (Sabia et al. 2021), increases opioid-related mortality (Mathur and Ruhm 2023)"},{"id":"opioid_literature","from":"mj_freq","to":"mathur_opioids","type":"related_outcome","label":"Shared legalization literature: mortality","explanation":"The paper says its results complement the broader marijuana-legalization literature. These are distinct outcomes under a shared policy topic; the findings do not imply causal links between outcomes or comparable effect sizes.","basis":"map_comparison","page":4,"quote":"reduces fertility (Papich 2022) and drug-related arrests (Sabia et al. 2021), increases opioid-related mortality (Mathur and Ruhm 2023)"}],"caveats":["This map covers the supplied paper and its account of selected cited studies, not the entire literature; cited papers were not independently read or verified.","The paper uses staggered difference-in-differences designs and argues for causal effects under identifying assumptions; the map does not independently establish causality.","Substance use, GPA, study time, and completion are related findings, but estimated mediation through any mechanism is not established.","Some subgroup results and supplemental table entries are summarized qualitatively because the extracted table layouts are difficult to parse; no ambiguous exact estimates are reproduced.","Frequency scores include nonusers, and some reported prescription medication use may appear in drug-use measures."],"methods":{"summary":"The paper uses state policy timing and cohort or survey comparisons to estimate RML effects. Its identification argument combines prior-MML sample restrictions, pre-policy college enrollment, group-time DiD estimation, parallel-trend diagnostics and outcome-specific checks. This map separates stated design choices, required assumptions, reported evidence and remaining limits; it does not verify the underlying code or certify identification.","nodes":[{"id":"target","kind":"estimand","label":"Effects on pre-policy college enrollees","summary":"The graduation analysis targets policy exposure after initial enrollment, rather than the effect on all potential applicants.","detail":"The stated restriction addresses policy-induced entry selection. It does not make the estimated effect a population-wide college-entry effect.","scope":"IPEDS graduation outcomes","status":"described","basis":"paper_explicit","page":7,"quote":"students who were already\nenrolled at the time of legalization"},{"id":"timing","kind":"treatment","label":"September cutoff defines treatment year","summary":"Enactments on or after September 1 are assigned to the next calendar year.","detail":"The paper aligns policy timing with degrees recorded through August 31. Legal enactment is not identical to the opening of retail sales.","scope":"State RML exposure coding","status":"described","basis":"paper_explicit","page":9,"quote":"enactments occurring on or after Septem-\nber 1 are assigned to the subsequent calendar year"},{"id":"exposure","kind":"treatment","label":"Exposure is indexed by college cohort","summary":"Graduation exposure depends on the academic year since entry at legalization and the horizon of the completion outcome.","detail":"BA specifications use exposure years 1–11. Two-year institutions use 1–7. This is distinct from calendar event time in the survey outcomes.","scope":"Four-, five-, six-year BA and three-year two-year-college outcomes","status":"described","basis":"paper_explicit","page":40,"quote":"cohorts ex-\nposed to RML between academic years 1 and 11 after first enrollment"},{"id":"reference","kind":"comparison","label":"Reference cohort depends on outcome horizon","summary":"The omitted cohorts are academic years 5, 6 and 7 for four-, five- and six-year BA completion.","detail":"The corresponding omitted category for three-year completion at two-year institutions is academic year 4. Read each event-study horizon with its own reference group.","scope":"Graduation event studies","status":"described","basis":"paper_explicit","page":40,"quote":"The\nomitted reference cohort is academic year 5 for four-year completion"},{"id":"controls","kind":"comparison","label":"Not-yet-treated and never-treated controls","summary":"Group-time effects compare policy-exposed units with units that have not yet adopted, including never-treated units.","detail":"The comparison is not a simple cross-sectional difference between legal and nonlegal states. Its causal interpretation still depends on counterfactual trend assumptions.","scope":"Staggered RML comparisons","status":"described","basis":"paper_explicit","page":9,"quote":"using never- or not-yet-\ntreated units as valid comparisons"},{"id":"early_mml","kind":"data","label":"Restrict states by prior medical legalization","summary":"The baseline restricts the sample to states with MML treatment on or before the 2010 cutoff.","detail":"The restriction aims to separate RML from earlier MML exposure. Alternative cutoffs change the included states and, for graduation, may change entering cohorts.","scope":"Baseline RML estimates","status":"described","basis":"paper_explicit","page":8,"quote":"states whose MML treatment year occurred on\nor before 2010"},{"id":"ipeds","kind":"data","label":"Balanced institution and entering-cohort panel","summary":"BA entering cohorts span 2006–2017; two-year institution cohorts span 2008–2017. Institutions with extreme completion rates are excluded.","detail":"The paper excludes institutions with a 0 or 100 percent completion rate in any observed cohort. The retained sample is not all institutions.","scope":"IPEDS graduation analysis","status":"described","basis":"paper_explicit","page":6,"quote":"the primary analysis\nuses a balanced panel of institutions"},{"id":"psid","kind":"data","label":"PSID panel and enrolled-only GPA","summary":"The PSID panel is unbalanced; GPA is observed only among currently enrolled respondents ages 18–24.","detail":"Attendance is available only for 2011, 2013 and 2015 in the extracted data. GPA estimates are conditional on current enrollment; substance-use estimates include both enrollment statuses.","scope":"GPA, attendance and substance-use analyses","status":"described","basis":"paper_explicit","page":6,"quote":"the analysis relies on an unbalanced panel"},{"id":"atus","kind":"data","label":"Repeated cross-sections of daily time use","summary":"ATUS supplies time diaries for people ages 18–24 in 2010–2023, regardless of college enrollment.","detail":"Time-use observations are respondent-days, not a panel tracking the same students through graduation.","scope":"Study and leisure outcomes","status":"described","basis":"paper_explicit","page":39,"quote":"an annual, nationally representative repeated cross-sectional sur-\nvey"},{"id":"cs","kind":"estimator","label":"Group-time ATT for staggered adoption","summary":"The paper uses the Callaway and Sant’Anna estimator to handle cohort and time variation in treatment effects.","detail":"The methods map reports the estimator named in the manuscript; it does not verify the underlying analysis code or software options.","scope":"RML analyses as described by the author","status":"described","basis":"paper_explicit","page":8,"quote":"I employ the estimator\ndeveloped by Callaway and Sant’Anna (2021"},{"id":"fe_grad","kind":"estimator","label":"Institution and cohort fixed effects","summary":"The graduation specification describes institution and entering-cohort fixed effects.","detail":"These absorb time-invariant institutional differences and common cohort shocks. The paper distinguishes this regression description from its preferred group-time estimator.","scope":"Graduation specification, Equation 1","status":"described","basis":"paper_explicit","page":8,"quote":"By including institution and cohort fixed\neffects"},{"id":"fe_psid","kind":"estimator","label":"Individual and period fixed effects","summary":"The individual outcome specification includes individual and survey-period fixed effects.","detail":"Survey periods are biennial; the observation period differs across outcomes, especially current attendance.","scope":"PSID GPA, attendance and substance use","status":"described","basis":"paper_explicit","page":13,"quote":"The regression includes both individual fixed effects and\nperiod fixed effects"},{"id":"fe_atus","kind":"estimator","label":"State, year and diary-timing controls","summary":"The time-use specification controls for age, diary month, day of week, holiday timing, state and year.","detail":"Repeated cross-sections do not have the same individual fixed-effects structure described for PSID. Keep these outcome-specific designs separate.","scope":"ATUS time-use specification, Equation 3","status":"described","basis":"paper_explicit","page":14,"quote":"state fixed effects and time fixed effects"},{"id":"aggregation","kind":"estimator","label":"Dynamic effects and aggregate ATT differ","summary":"An overall ATT aggregates across post-treatment periods; each event-time coefficient uses a narrower subset.","detail":"A statistically significant average estimate can coexist with imprecise event-time estimates. That difference does not establish a difference between effects.","scope":"Dynamic and average policy estimates","status":"described","basis":"paper_explicit","page":40,"quote":"the overall ATT aggregates\ninformation across all post-treatment periods"},{"id":"parallel","kind":"assumption","label":"Parallel counterfactual outcome trends","summary":"Without treatment, treated and comparison units would have evolved along the same counterfactual outcome path.","detail":"Pre-treatment diagnostics can reveal some violations but cannot establish the unobserved post-treatment counterfactual.","scope":"Difference-in-differences identification","status":"assumed","basis":"paper_explicit","page":9,"quote":"treated and comparison units would have evolved along the same coun-\nterfactual trajectory"},{"id":"selection","kind":"assumption","label":"Policy must not confound sample composition","summary":"The pre-policy-enrollment design aims to isolate outcomes among already enrolled students from policy-induced changes in who enters.","detail":"This requirement is reconstructed from the paper’s selection discussion. Restricting initial entry is different from ruling out all later enrollment or sample-selection changes.","scope":"Graduation interpretation; GPA remains conditional on current enrollment","status":"assumed","basis":"map_interpretation","page":7,"quote":"RML may change the composition of enrolled students"},{"id":"overlap","kind":"assumption","label":"Earlier MML must not confound RML","summary":"The sample design assumes prior medical legalization does not contaminate the relevant comparison of RML outcomes.","detail":"Changing sample cutoffs probes sensitivity to this restriction; it does not directly isolate every possible continuing MML effect.","scope":"Early-MML-state RML sample","status":"assumed","basis":"paper_explicit","page":19,"quote":"MML does not con-\ntaminate the pre-treatment period"},{"id":"leads","kind":"diagnostic","label":"Graduation pre-trends are not statistically significant","summary":"The paper reports pre-treatment event-study estimates centered near zero without statistical significance.","detail":"These are supportive diagnostics only. Limited precision can leave economically relevant departures undetected.","scope":"Graduation event studies","status":"supportive","basis":"map_interpretation","page":10,"quote":"the pre-treatment estimates are sta-\ntistically insignificant and centered around zero"},{"id":"timing_check","kind":"diagnostic","label":"Check predictors of policy timing","summary":"The paper regresses legalization timing on baseline outcomes as an additional diagnostic.","detail":"These are diagnostic regressions, not randomization tests establishing exogenous timing. Do not read the broad narrative as a guarantee that every reported interval includes zero.","scope":"Policy-timing checks in Appendix A2 and Table A1","status":"mixed","basis":"map_interpretation","page":41,"quote":"each main outcome\nis entered separately as an explanatory variable"},{"id":"bacon","kind":"diagnostic","label":"TWFE decomposition motivates estimator choice","summary":"The paper reports substantial treated-versus-treated timing comparisons in the conventional TWFE estimate.","detail":"This diagnostic motivates using an estimator designed for heterogeneous effects. It does not itself test parallel trends.","scope":"Graduation comparison of estimators","status":"described","basis":"paper_explicit","page":8,"quote":"about 55% of the TWFE\nestimate is driven by treated-versus-treated timing comparisons"},{"id":"attendance","kind":"diagnostic","label":"Attendance offers a limited selection check","summary":"The average attendance estimate is not statistically significant, but follow-up is short and an earlier pre-treatment difference is reported.","detail":"The 2011–2015 attendance window and the significant event-time −3 difference limit reassurance. An insignificant average does not exclude changes in enrolled-student composition.","scope":"Selection into observed GPA","status":"mixed","basis":"paper_explicit","page":14,"quote":"The attendance result offers only a limited check on selection into the GPA\nsample"},{"id":"cutoffs","kind":"robustness","label":"Vary the prior-MML cutoff","summary":"Alternative cutoffs change sample membership, with significance and magnitudes varying across outcomes.","detail":"Four- and five-year BA completion lose significance for some cutoffs; six-year and two-year completion remain significant in the reported comparisons. Treat robustness as outcome-specific.","scope":"Tables A4–A10","status":"mixed","basis":"paper_explicit","page":20,"quote":"the estimated effects are statistically insignificant when the cutoff year is set\nbetween 2005 and 2009"},{"id":"disclosure","kind":"diagnostic","label":"Placebo tests assess disclosure changes","summary":"The paper uses reported age at first use and reassigned policy years to assess a particular disclosure-bias measure.","detail":"The reported non-significant results concern this operationalized reporting-bias measure, not every possible measurement error.","scope":"Substance-use measurement, Table A12","status":"supportive","basis":"map_interpretation","page":41,"quote":"1,000 placebo simulations in which\nRML legalization years are randomly reassigned across states"},{"id":"recoding","kind":"robustness","label":"Recode or exclude inconsistent ever-use histories","summary":"Alternative coding imposes persistent ever-use status, or excludes respondents with inconsistent reports.","detail":"These change the measure or analysis sample. A changed significance result is not evidence that the baseline and alternative effects differ statistically.","scope":"Substance-use robustness, Table A17","status":"mixed","basis":"paper_explicit","page":19,"quote":"The checks impose consistent ever-use\nhistories or exclude respondents with inconsistent reports"},{"id":"cluster","kind":"inference","label":"Cluster uncertainty at the state level","summary":"Uncertainty is clustered at the level of policy adoption.","detail":"The number of independent state clusters matters; institution- or person-level observation counts do not replace the number of policy clusters.","scope":"Reported RML inference","status":"described","basis":"paper_explicit","page":9,"quote":"I therefore cluster stan-\ndard errors at the state level"},{"id":"bootstrap","kind":"inference","label":"Use a wild multiplier bootstrap","summary":"The manuscript describes the built-in one-step wild multiplier bootstrap for inference.","detail":"This is a method for inference. It does not fix selection, measurement error, policy confounding or violations of parallel trends.","scope":"Callaway–Sant’Anna inference","status":"described","basis":"paper_explicit","page":40,"quote":"Implemented as\na one-step wild (multiplier) bootstrap"},{"id":"gpa_limit","kind":"limitation","label":"Current enrollment can select the GPA sample","summary":"Observed GPA may change partly because the composition of currently enrolled students changes.","detail":"The attendance diagnostic is limited and does not identify the counterfactual GPA of people no longer observed in college.","scope":"GPA interpretation","status":"limitation","basis":"paper_explicit","page":14,"quote":"changes\nin who remains in college could affect its interpretation"},{"id":"reporting_limit","kind":"limitation","label":"Self-reports may change after legalization","summary":"Willingness to disclose use and inconsistent histories are separate measurement concerns.","detail":"The two reporting checks address distinct issues. Neither establishes that all reporting behavior is stable.","scope":"Substance-use interpretation","status":"limitation","basis":"paper_explicit","page":41,"quote":"individuals\nmay become more willing to disclose marijuana or other illicit drug use after\nRML"},{"id":"mechanism_limit","kind":"limitation","label":"Policy effects do not identify mediation shares","summary":"Separate effects on substance use or GPA do not identify how much of the graduation effect operates through those channels.","detail":"The maps can relate findings as possible mechanisms, but cannot turn those relationships into an identified mediation design.","scope":"Mechanism interpretation","status":"limitation","basis":"paper_explicit","page":20,"quote":"do not identify how much of the\neducational effect operates through any particular substance"},{"id":"count_limit","kind":"limitation","label":"State counts need reconciliation","summary":"The sample count is described inconsistently in the manuscript.","detail":"Page 5 says 15 total states; page 9 describes 15 adopting states plus one nonadopter. Table 2 and the estimation sample should be reconciled before treating the count as settled.","scope":"Baseline sample documentation","status":"limitation","basis":"map_interpretation","page":5,"quote":"The baseline sample contains 15 states"},{"id":"anticipation","kind":"assumption","label":"No policy-induced response before assigned exposure","summary":"Interpreting pre-policy cohorts as unexposed requires attention to anticipatory enrollment or behavior.","detail":"This is a map reconstruction prompted by the exposure definition. A dedicated anticipation-window sensitivity analysis was not located in the supplied text; the context excerpt is not a report of such a test.","scope":"Treatment-year coding and pre-policy enrollment","status":"not_assessed","basis":"map_interpretation","page":9,"quote":"students who enrolled before the\ntreatment year"}],"relations":[{"id":"target_design","from":"cs","to":"target","type":"identifies","label":"Estimator targets the enrolled-cohort effect","explanation":"The target population and exposure definition determine how the reported treatment effect is interpreted.","basis":"map_interpretation","page":7,"quote":"students who were already\nenrolled at the time of legalization"},{"id":"cs_controls","from":"controls","to":"cs","type":"implements","label":"Control construction implements group-time comparisons","explanation":"Never-treated or not-yet-treated units supply the comparison observations in the described estimator.","basis":"map_interpretation","page":9,"quote":"using never- or not-yet-\ntreated units as valid comparisons"},{"id":"cs_parallel","from":"cs","to":"parallel","type":"requires","label":"Causal interpretation requires parallel trends","explanation":"The paper explicitly states parallel trends as the counterfactual condition behind its DiD interpretation.","basis":"map_interpretation","page":9,"quote":"identification rests on the parallel trends assumption"},{"id":"timing_exposure","from":"timing","to":"exposure","type":"implements","label":"Calendar timing determines cohort exposure","explanation":"The September rule assigns a treatment year, which is then translated into academic-year exposure.","basis":"map_interpretation","page":9,"quote":"assigned to the subsequent calendar year"},{"id":"reference_exposure","from":"reference","to":"exposure","type":"implements","label":"Outcome horizons define the omitted cohort","explanation":"The reference category changes with the completion horizon, rather than using a single reference across all outcomes.","basis":"map_interpretation","page":40,"quote":"The\nomitted reference cohort is academic year 5"},{"id":"enrollment_requires","from":"target","to":"selection","type":"requires","label":"Enrolled-cohort interpretation requires selection control","explanation":"The paper restricts pre-policy enrollment to reduce endogenous entry composition.","basis":"map_interpretation","page":7,"quote":"By conditioning on pre-policy enrollment"},{"id":"timing_requires","from":"timing","to":"anticipation","type":"requires","label":"Assigned exposure also raises anticipation questions","explanation":"The assigned treatment year defines who is treated as unexposed. The map flags anticipatory responses as a separate unassessed issue.","basis":"map_interpretation","page":9,"quote":"students who enrolled before the\ntreatment year"},{"id":"mml_requires","from":"early_mml","to":"overlap","type":"requires","label":"Sample restriction depends on policy separation","explanation":"Earlier MML adoption is used to improve separation of medical and recreational policy exposure.","basis":"map_interpretation","page":19,"quote":"MML does not con-\ntaminate the pre-treatment period"},{"id":"leads_parallel","from":"leads","to":"parallel","type":"assesses","label":"Pre-treatment coefficients assess prior trends","explanation":"The reported leads offer limited support for prior comparability; they do not prove the counterfactual assumption.","basis":"map_interpretation","page":10,"quote":"the pre-treatment estimates are sta-\ntistically insignificant and centered around zero"},{"id":"timing_parallel","from":"timing_check","to":"parallel","type":"assesses","label":"Timing regressions probe baseline comparability","explanation":"Regressing timing on observed baseline outcomes is a partial diagnostic, not a complete test of future counterfactual trends.","basis":"map_interpretation","page":41,"quote":"each main outcome\nis entered separately as an explanatory variable"},{"id":"bacon_cs","from":"bacon","to":"cs","type":"supports","label":"Timing comparisons motivate group-time estimation","explanation":"The reported decomposition motivates the choice of a heterogeneous-treatment estimator rather than certifying causal identification.","basis":"map_interpretation","page":8,"quote":"I therefore rely on esti-\nmators designed for staggered adoption"},{"id":"attendance_selection","from":"attendance","to":"selection","type":"assesses","label":"Attendance checks part of the selection concern","explanation":"Attendance is one observed enrollment margin; its short follow-up limits the check.","basis":"map_interpretation","page":14,"quote":"The attendance result offers only a limited check on selection"},{"id":"attendance_limit","from":"attendance","to":"gpa_limit","type":"addresses","label":"The selection check leaves an explicit limitation","explanation":"The paper itself cautions that current attendance does not exhaust composition changes.","basis":"map_interpretation","page":14,"quote":"an insignificant average effect does not exclude changes in the\ncomposition of enrolled students"},{"id":"gpa_limit_psid","from":"gpa_limit","to":"psid","type":"qualifies","label":"Enrolled-only GPA limits population interpretation","explanation":"The GPA sample differs from all young adults and can change with continued enrollment.","basis":"map_interpretation","page":14,"quote":"changes\nin who remains in college could affect its interpretation"},{"id":"cutoff_overlap","from":"cutoffs","to":"overlap","type":"assesses","label":"Cutoff sensitivity probes policy overlap","explanation":"Cutoff changes alter the early-MML sample but do not separately identify every dynamic MML effect.","basis":"map_interpretation","page":19,"quote":"Changing the cutoff year results in modest\nvariation in the set of states"},{"id":"cutoff_sample","from":"cutoffs","to":"early_mml","type":"qualifies","label":"Robustness depends on the included states","explanation":"Robustness is not uniform across all outcomes or cutoff years.","basis":"map_interpretation","page":20,"quote":"the estimated effects are statistically insignificant when the cutoff year is set\nbetween 2005 and 2009"},{"id":"disclosure_report","from":"disclosure","to":"reporting_limit","type":"assesses","label":"Disclosure placebo targets one reporting threat","explanation":"The disclosure indicator and randomized policy years target a specific operational definition of reporting bias.","basis":"map_interpretation","page":41,"quote":"Table A12 reports the placebo tests for changes in disclosure after RML"},{"id":"recoding_report","from":"recoding","to":"reporting_limit","type":"addresses","label":"Consistency coding addresses reversals in reports","explanation":"Persistent ever-use coding and exclusions address inconsistent histories, a distinct issue from new disclosure after legalization.","basis":"map_interpretation","page":19,"quote":"The checks impose consistent ever-use\nhistories or exclude respondents with inconsistent reports"},{"id":"cluster_bootstrap","from":"bootstrap","to":"cluster","type":"implements","label":"Bootstrap implements clustered uncertainty","explanation":"The described procedure supplements state-level clustering when the number of clusters is limited.","basis":"map_interpretation","page":9,"quote":"the limited number of state clusters"},{"id":"grad_data_design","from":"ipeds","to":"fe_grad","type":"implements","label":"Graduation design uses institution-cohort data","explanation":"The institution-cohort outcome panel underlies the graduation specification.","basis":"map_interpretation","page":8,"quote":"By including institution and cohort fixed\neffects"},{"id":"psid_design","from":"psid","to":"fe_psid","type":"implements","label":"PSID supports the individual outcome design","explanation":"Individual and period fixed effects are described for the PSID outcomes rather than the ATUS repeated cross-sections.","basis":"map_interpretation","page":13,"quote":"The regression includes both individual fixed effects and\nperiod fixed effects"},{"id":"atus_design","from":"atus","to":"fe_atus","type":"implements","label":"Repeated cross-sections use their own controls","explanation":"The time-use equation combines state/year and diary-timing controls.","basis":"map_interpretation","page":14,"quote":"state fixed effects and time fixed effects"},{"id":"att_cs","from":"aggregation","to":"cs","type":"implements","label":"Group-time effects allow dynamic and average summaries","explanation":"The map distinguishes narrower event-time estimates from the aggregated ATT.","basis":"map_interpretation","page":40,"quote":"the overall ATT aggregates\ninformation across all post-treatment periods"},{"id":"mediation_target","from":"mechanism_limit","to":"target","type":"qualifies","label":"Reduced-form effects do not identify mediation","explanation":"The effect on graduation and effects on candidate channels do not identify mediated shares.","basis":"map_interpretation","page":20,"quote":"do not identify how much of the\neducational effect operates through any particular substance"},{"id":"count_sample","from":"count_limit","to":"early_mml","type":"qualifies","label":"Sample documentation needs reconciliation","explanation":"The manuscript descriptions do not agree on the total number of baseline states.","basis":"map_interpretation","page":5,"quote":"The baseline sample contains 15 states"}],"caveats":["Prepared from the supplied manuscript text for this local prototype, without a new model API call. Design connections marked as map interpretations are explanatory reconstructions.","Diagnostic non-significance is supporting or inconclusive evidence, not proof that an identification assumption holds.","The graduation, enrolled-only GPA, attendance, repeated-cross-section time-use and substance-use designs have different samples and observation windows.","The manuscript contains inconsistent state-count descriptions. The map flags this rather than resolving it without the data and code.","The anticipation node records an issue not separately assessed in the supplied text; its quotation provides design context only."]},"checks":{},"demo":false}</script>

</script><script id="academic-map-shell">/* Navigation and optional animation around the supplied PaperBranch drawing functions. */
(() => {
  'use strict';
  const host = document.getElementById('paperbranch-viewer');
  const mode = document.body.dataset.mapView;
  const original = JSON.parse(document.getElementById('paperbranch-data').textContent);
  const view = mode === 'methods' ? original.methods : original;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let autoRotate = !reducedMotion.matches, animationFrame = null, lastFrame = null;
  let activeCanvas = null, inView = false;
  let initialized = false;
  const picker = () => host.querySelector('.detail-panel select');
  const autoButton = document.createElement('button');
  autoButton.type = 'button';
  autoButton.id = 'paper-auto-rotate';
  autoButton.addEventListener('click', () => setAuto(!autoRotate));
  function animate() {
    if (!autoRotate || !inView || document.hidden || animationFrame !== null) return;
    animationFrame = requestAnimationFrame(now => {
      animationFrame = null;
      if (!autoRotate || !inView || document.hidden) { lastFrame = null; return; }
      const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 50);
      lastFrame = now;
      // The original drag handler turns by 0.006 radians per pixel; one revolution per minute.
      activeCanvas?.dispatchEvent(new CustomEvent('paperbranch-auto-rotate', { detail: elapsed * Math.PI * 2 / 60000 / .006 }));
      animate();
    });
  }
  function setAuto(value) {
    autoRotate = value;
    lastFrame = null;
    if (animationFrame !== null) cancelAnimationFrame(animationFrame);
    animationFrame = null;
    autoButton.textContent = value ? 'Pause rotation' : 'Start rotation';
    autoButton.setAttribute('aria-pressed', String(value));
    if (value) animate();
  }
  const visibility = new IntersectionObserver(entries => {
    inView = entries.some(entry => entry.target === activeCanvas && entry.isIntersecting);
    lastFrame = null;
    if (!inView && animationFrame !== null) { cancelAnimationFrame(animationFrame); animationFrame = null; }
    animate();
  });

  function choose(id) {
    setAuto(false);
    const select = picker();
    if (!select || !Array.from(select.options).some(option => option.value === id)) return;
    select.value = id;
    select.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function closeDetails() {
    setAuto(false);
    const back = host.querySelector('.back-full-map');
    if (back) back.click();
    else choose('question:root');
  }
  function synchronize() {
    const tab = document.getElementById(mode === 'methods' ? 'methods-tab' : 'findings-tab');
    if (!tab) return;
    if (!initialized && tab.getAttribute('aria-selected') !== 'true') { tab.click(); return; }
    const select = picker();
    if (!select || !host.querySelector('canvas')) return;
    initialized = true;
    host.dataset.ready = 'true';
    const canvas = host.querySelector('canvas');
    if (canvas !== activeCanvas) {
      visibility.disconnect();
      activeCanvas = canvas;
      lastFrame = null;
      visibility.observe(canvas);
    }
    const toolbar = host.querySelector('.map-toolbar');
    if (toolbar && !toolbar.contains(autoButton)) toolbar.append(autoButton);
    const focused = host.querySelector('.offline-app')?.classList.contains('is-focused');
    const selected = focused || select.value !== 'question:root';
    document.body.toggleAttribute('data-detail-open', selected);
    const panel = select.closest('.detail-panel');
    let close = panel.querySelector('.academic-close-detail');
    if (!close) {
      close = document.createElement('button');
      close.className = 'academic-close-detail';
      close.type = 'button';
      close.textContent = 'Close details';
      close.addEventListener('click', closeDetails);
      panel.prepend(close);
    }
    close.hidden = !selected;
    const branch = host.querySelector('.map-toolbar select');
    if (branch) branch.setAttribute('aria-label', mode === 'methods' ? 'Method branch' : 'Research branch');
  }

  const index = document.createElement('details');
  index.className = 'node-index';
  const summary = document.createElement('summary');
  summary.textContent = `Browse all ${view.nodes.length} nodes`;
  const list = document.createElement('div');
  list.className = 'node-index-list';
  view.nodes.forEach(node => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = node.label;
    button.addEventListener('click', () => {
      choose(node.id);
      host.querySelector('.graph-area')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    list.append(button);
  });
  index.append(summary, list);
  // Outside the React root: every original node has a readable, untruncated entry.
  host.after(index);
  const container = document.createElement('div');
  container.className = 'offline-app node-index-container';
  index.replaceWith(container);
  container.append(index);
  document.querySelector('[data-open-node]')?.addEventListener('click', event => choose(event.currentTarget.dataset.openNode));
  host.addEventListener('pointerdown', event => { if (!autoButton.contains(event.target)) setAuto(false); }, true);
  host.addEventListener('change', () => setAuto(false), true);
  host.addEventListener('keydown', event => { if (event.target !== autoButton) setAuto(false); }, true);
  host.addEventListener('wheel', event => { if (event.target.closest('.graph-area')) setAuto(false); }, { capture: true, passive: true });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeDetails(); });
  document.addEventListener('visibilitychange', () => {
    lastFrame = null;
    if (document.hidden && animationFrame !== null) { cancelAnimationFrame(animationFrame); animationFrame = null; }
    animate();
  });
  reducedMotion.addEventListener('change', event => { if (event.matches) setAuto(false); });
  new MutationObserver(synchronize).observe(host, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'aria-selected'] });
  setAuto(autoRotate);
  synchronize();
})();
